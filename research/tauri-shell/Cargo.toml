[package]
name = "tuanjie-cowork"
version = "2.1.3-canary.2"
description = "Tuanjie Cowork (GameCowork) 桌面壳 — 逆向重建骨架，非可编译原版"
edition = "2021"
authors = ["gamecowork (原作) / 逆向重建"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 原版还使用了（依据二进制字符串推断，版本号待定）：
# - WebView2 引导（wry 默认）
# - 自研 licensing / hub 通信逻辑（对应 hub/ 目录的 .NET LicensingClient）
# - process_killer.exe 伴生进程管理
