<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/branding/logo_dark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameCowork Desktop</title>
    <style id="gamecowork-theme-bootstrap">
      html {
        background-color: #222222;
        color-scheme: dark;
      }
      html[data-theme="light"] {
        background-color: #eeeeee;
        color-scheme: light;
      }
      body {
        margin: 0;
        background-color: inherit;
      }
    </style>
    <script>
      (function () {
        try {
          var theme = JSON.parse(localStorage.getItem("gamecowork-theme") || "null");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {}
      })();
    </script>
