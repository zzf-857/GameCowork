[package]
name = "gamecowork-shell"
version = "2.1.3-canary.2"
edition = "2021"
description = "GameCowork 桌面壳: HTTP 网关(/api/tauri/*) + WebView2 + core stdio 中继"

[[bin]]
name = "GameCowork"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json", "ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "set-header"] }
wry = "0.45"
tao = "0.30"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
regex = "=1.12.3"
sha2 = "=0.10.9"
notify = "=6.1.1"
tar = "=0.4.46"
flate2 = "=1.1.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Power", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = 2
