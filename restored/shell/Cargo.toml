[package]
name = "gamecowork-shell"
version = "2.1.3-canary.2"
edition = "2021"
description = "GameCowork 桌面壳: HTTP 网关(/api/tauri/*) + WebView2 + core stdio 中继"

[[bin]]
name = "GameCowork"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "set-header"] }
wry = "0.45"
tao = "0.30"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"

[profile.release]
opt-level = 2
