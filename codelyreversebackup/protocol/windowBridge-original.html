<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unity Window Bridge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e; color: #e0e0e0; height: 100vh;
    display: flex; flex-direction: column;
  }
  select, button {
    background: #0f3460; color: #e0e0e0; border: 1px solid #533483;
    padding: 6px 14px; border-radius: 6px; font-size: 13px;
    cursor: pointer; outline: none;
  }
  select:hover, button:hover { border-color: #e94560; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .main-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden; background: #111;
    cursor: default;
    user-select: none;
    touch-action: none;
    -webkit-user-drag: none;
  }
  /* SceneView drag cursor: DOM overlay approach.
     CSS cursor is unreliable when Unity's Focus() steals macOS app activation.
     Instead we hide the OS cursor and show a positioned <div> overlay. */
  .main-area.cursor-dragging { cursor: none !important; }
  .main-area.cursor-dragging * { cursor: none !important; }
  /* Browsers ignore element cursor during pointer-capture drag; force it. */
  .main-area.force-editor-cursor,
  .main-area.force-editor-cursor * {
    cursor: var(--editor-cursor, default) !important;
  }
  #cursorOverlay {
    position: absolute; pointer-events: none; z-index: 9999;
    width: 32px; height: 32px; display: none;
    background-size: 32px 32px; background-repeat: no-repeat;
    image-rendering: auto;
  }
  #remoteVideo {
    max-width: 100%; max-height: 100%; object-fit: contain;
    background: #000; display: none;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  #streamCanvas {
    max-width: 100%; max-height: 100%; object-fit: contain;
    display: none;
    pointer-events: none;
    user-select: none;
  }
  .placeholder {
    color: #555; font-size: 16px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .placeholder svg { width: 64px; height: 64px; opacity: 0.3; }

  /* ========== Frontend Popup Menu Styles ========== */
  .popup-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1000;
    overflow: visible;
    pointer-events: none;
  }
  .popup-overlay .popup-menu {
    pointer-events: auto;
  }
  .popup-menu {
    position: absolute;
    min-width: 160px; max-width: 350px;
    background: #3c3c3c; border: 1px solid #555;
    border-radius: 4px; padding: 2px 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 12px; color: #e0e0e0;
    overflow: visible;
    box-sizing: border-box;
  }
  .popup-menu-scroll {
    overflow-x: hidden;
    overflow-y: auto;
    max-height: 400px;
  }
  .popup-menu-context {
    max-width: 420px;
  }
  .popup-menu-context > .popup-menu-scroll {
    max-height: none;
    overflow: visible;
  }
  .popup-submenu-context {
    max-height: none;
    overflow: visible;
  }
  .popup-menu-annotation {
    min-width: 290px;
    max-width: 420px;
    max-height: 620px;
  }
  .popup-menu-icon-selector {
    min-width: 140px;
    max-width: 140px;
    width: 140px;
    padding: 4px 4px 6px;
    box-sizing: border-box;
  }
  .icon-selector-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 4px 4px;
    font-size: 11px;
    color: #ddd;
  }
  .icon-selector-none-btn {
    border: none;
    background: #4a4a4a;
    color: #ddd;
    font-size: 10px;
    line-height: 12px;
    padding: 1px 6px;
    border-radius: 2px;
    cursor: default;
  }
  .icon-selector-none-btn:hover {
    background: #2d6da3;
    color: #fff;
  }
  .icon-selector-sep {
    height: 1px;
    background: #555;
    margin: 3px 2px;
  }
  .icon-selector-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    padding: 2px 4px;
    justify-content: flex-start;
  }
  .icon-selector-icon {
    width: 12px;
    height: 12px;
    padding: 1px;
    border: 1px solid transparent;
    border-radius: 2px;
    box-sizing: content-box;
    cursor: default;
    image-rendering: pixelated;
  }
  .icon-selector-icon:hover {
    border-color: #888;
    background: rgba(255,255,255,0.08);
  }
  .icon-selector-icon.selected {
    border-color: #6eb1ff;
    background: rgba(45,109,163,0.45);
  }
  .popup-item {
    padding: 4px 24px 4px 28px; cursor: default;
    white-space: nowrap; position: relative;
    line-height: 20px;
  }
  .popup-item-has-shortcut {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }
  .popup-item-label {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .popup-item-shortcut {
    flex: none;
    color: #999;
    font-size: 11px;
    margin-left: auto;
    padding-left: 12px;
  }
  .popup-item:hover:not(.popup-item-disabled) .popup-item-shortcut,
  .popup-item.popup-item-hover:not(.popup-item-disabled) .popup-item-shortcut {
    color: #ddd;
  }
  .popup-item:hover:not(.popup-item-disabled),
  .popup-item.popup-item-hover:not(.popup-item-disabled) {
    background: #2d6da3; color: #fff;
  }
  .popup-item-disabled {
    color: #777; cursor: default;
  }
  .popup-section-header {
    color: #aaa; font-size: 11px; font-weight: 600;
    padding: 4px 8px 2px 8px; cursor: default;
    text-transform: none; letter-spacing: 0.3px;
  }
  .popup-item-checked::before {
    content: '\2713'; position: absolute; left: 8px;
    font-size: 13px; line-height: 20px;
  }
  .popup-separator {
    height: 1px; margin: 4px 0;
    background: #555;
  }
  .popup-item-submenu::after {
    content: '\25B6'; position: absolute; right: 8px;
    font-size: 9px; line-height: 20px;
  }
  .popup-item-has-submenu {
    padding-right: 28px;
  }
  .popup-submenu {
    display: none;
    min-width: 160px;
    max-width: 350px;
    background: #3c3c3c;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 2px 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    overflow-x: hidden;
    overflow-y: auto;
    max-height: min(60vh, 480px);
    box-sizing: border-box;
    pointer-events: auto;
  }
  .popup-submenu.popup-submenu-floating {
    position: absolute;
    z-index: 1001;
  }
  .popup-header {
    padding: 6px 10px 4px 10px;
    background: #383838;
    border-radius: 4px 4px 0 0;
  }
  .popup-toggle-row {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 0; cursor: default;
    font-size: 12px; color: #e0e0e0;
    white-space: nowrap;
  }
  .popup-toggle-row-annotation {
    justify-content: space-between;
    gap: 10px;
  }
  .popup-toggle-row-annotation .popup-toggle-main {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 130px;
  }
  .popup-toggle-row-annotation .popup-toggle-slider {
    flex: 1;
    min-width: 110px;
  }
  .popup-toggle-row-annotation .popup-toggle-slider input[type="range"] {
    width: 100%;
  }
  .popup-toggle-row input[type="checkbox"] {
    margin: 0; accent-color: #4a90d9;
  }
  .popup-toggle-disabled {
    opacity: 0.5; cursor: default;
  }
  .popup-add-btn {
    text-align: center; font-size: 16px; font-weight: bold;
    color: #aaa; padding: 2px 0;
  }
  .popup-add-btn:hover {
    background: #2d6da3; color: #fff;
  }
  .popup-search-row {
    padding: 4px 10px;
    border-bottom: 1px solid #555;
    background: #383838;
  }
  .popup-search-input {
    width: 100%;
    padding: 3px 6px;
    font-size: 11px;
    color: #e0e0e0;
    background: #2a2a2a;
    border: 1px solid #555;
    border-radius: 3px;
    outline: none;
  }
  .popup-search-input:focus { border-color: #2d6da3; }
  .popup-tab-row {
    display: flex;
    gap: 4px;
    padding: 4px 6px;
  }
  .popup-tab {
    flex: 1;
    font-size: 11px;
    padding: 3px 6px;
    color: #ccc;
    background: #333;
    border: 1px solid #555;
    border-radius: 3px;
    cursor: default;
  }
  .popup-tab.active {
    background: #2d6da3;
    border-color: #2d6da3;
    color: #fff;
  }
  .popup-slider-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 0;
  }
  .popup-slider-row input[type="range"] {
    flex: 1;
  }
  .popup-slider-value {
    width: 42px;
    text-align: right;
    color: #aaa;
    font-size: 11px;
  }
  .popup-column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    color: #8f8f8f;
    font-size: 10px;
    padding: 2px 8px 4px 8px;
    text-transform: lowercase;
    border-bottom: 1px solid #4f4f4f;
    margin-bottom: 2px;
  }
  .popup-column-header-label {
    flex: 1;
  }
  .popup-column-header-right {
    display: flex;
    align-items: center;
    gap: 0;
    width: 76px;
    justify-content: flex-end;
  }
  .popup-column-header-cell {
    width: 38px;
    text-align: center;
  }
  .popup-item-annotation {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-right: 6px;
    min-height: 20px;
  }
  .popup-item-annotation.popup-item-disabled {
    color: #7a7a7a;
  }
  .popup-anno-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .popup-anno-toggles {
    display: flex;
    align-items: center;
    gap: 0;
    flex-shrink: 0;
    width: 76px;
    justify-content: flex-end;
  }
  .popup-anno-cell {
    width: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .popup-anno-icon-btn {
    width: 18px;
    height: 18px;
    padding: 0;
    border: none;
    background: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }
  .popup-anno-icon-btn img {
    width: 16px;
    height: 16px;
    object-fit: contain;
    image-rendering: auto;
  }
  .popup-anno-icon-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .popup-anno-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
  }
  .popup-anno-toggle input[type="checkbox"] {
    margin: 0;
    accent-color: #4a90d9;
  }
  .popup-anno-toggle input[type="checkbox"]:disabled {
    opacity: 0.35;
  }

  /* ========== Frontend Panel UI Styles (Grid Settings, etc.) ========== */
  .panel-container {
    position: absolute;
    min-width: 230px; max-width: 360px;
    background: #383838; border: 1px solid #4a4a4a;
    border-radius: 2px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 12px; color: #e0e0e0;
    padding: 0;
  }
  .panel-title {
    padding: 6px 10px 5px 10px; font-weight: 600; font-size: 12px;
    background: #383838; border-radius: 2px 2px 0 0;
    border-bottom: 1px solid #4a4a4a;
    color: #e0e0e0;
  }
  .panel-section-header {
    padding: 6px 10px 2px 10px;
    color: #c8c8c8;
    font-weight: 600;
    font-size: 12px;
  }
  .panel-control {
    padding: 3px 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .panel-control-subfield {
    padding-left: 28px;
  }
  .panel-control-subfield .panel-control-label {
    min-width: 36px;
    color: #a8a8a8;
  }
  .panel-control-disabled {
    opacity: 0.42;
  }
  .panel-control-label {
    min-width: 104px; font-size: 12px; color: #c2c2c2;
    flex-shrink: 0;
  }
  .panel-checkbox-wrap {
    flex: 1;
    display: flex;
    justify-content: flex-end;
  }
  .panel-checkbox-wrap input[type="checkbox"] {
    margin: 0;
    accent-color: #4a90d9;
  }
  .panel-btn-strip {
    display: flex; gap: 0;
    border: 1px solid #555; border-radius: 3px;
    overflow: hidden; flex: 1;
  }
  .panel-btn-strip button {
    flex: 1; padding: 3px 10px; font-size: 11px;
    background: #4a4a4a; color: #ccc; border: none;
    border-right: 1px solid #555; cursor: default;
    outline: none; min-width: 30px;
  }
  .panel-btn-strip button:last-child { border-right: none; }
  .panel-btn-strip button:hover { background: #555; color: #fff; }
  .panel-btn-strip button.active {
    background: #2d6da3; color: #fff;
  }
  .panel-slider {
    flex: 1; display: flex; align-items: center; gap: 6px;
  }
  .panel-slider input[type="range"] {
    flex: 1; height: 4px; -webkit-appearance: none; appearance: none;
    background: #555; border-radius: 2px; outline: none;
    cursor: default;
  }
  .panel-slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; border-radius: 50%;
    background: #e0e0e0; cursor: default;
  }
  .panel-slider-value {
    font-size: 11px; color: #aaa; min-width: 46px; text-align: right;
    background: #2a2a2a;
    border: 1px solid #555;
    border-radius: 2px;
    padding: 2px 4px;
  }
  .panel-action-btn {
    flex: 1; padding: 4px 10px; font-size: 11px;
    background: #4a4a4a; color: #ccc; border: 1px solid #555;
    border-radius: 3px; cursor: default; outline: none;
  }
  .panel-action-btn:hover { background: #555; color: #fff; }
  .panel-btn-row {
    display: flex; gap: 6px; flex: 1;
  }
  .panel-linked-v3 {
    display: flex; align-items: center; gap: 2px; flex: 1;
    min-width: 0;
  }
  .panel-link-btn {
    width: 22px; height: 22px; padding: 0; font-size: 11px;
    background: #4a4a4a; color: #888; border: 1px solid #555;
    border-radius: 3px; cursor: default; outline: none;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .panel-link-btn.active { background: #2d6da3; color: #fff; }
  .panel-v3-label {
    font-size: 10px; color: #999; min-width: 8px; text-align: center;
  }
  .panel-v3-input {
    width: 40px; padding: 2px 3px; font-size: 11px;
    background: #2a2a2a; color: #e0e0e0; border: 1px solid #555;
    border-radius: 3px; outline: none; text-align: right;
    box-sizing: border-box;
  }
  .panel-v3-input::-webkit-outer-spin-button,
  .panel-v3-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .panel-v3-input[type="number"] {
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .panel-v3-input:disabled { opacity: 0.4; }
  .panel-v3-input:focus { border-color: #2d6da3; }
  .panel-float-input {
    flex: 1; padding: 2px 6px; font-size: 11px;
    background: #2a2a2a; color: #e0e0e0; border: 1px solid #555;
    border-radius: 3px; outline: none; text-align: right;
  }
  .panel-float-input:disabled {
    opacity: 0.55;
    cursor: default;
  }
  .panel-float-input:focus { border-color: #2d6da3; }
  .panel-text-input {
    flex: 1; padding: 3px 6px; font-size: 11px;
    background: #2a2a2a; color: #e0e0e0; border: 1px solid #555;
    border-radius: 3px; outline: none;
  }
  .panel-text-input:focus { border-color: #2d6da3; }
  .panel-dropdown {
    flex: 1; padding: 2px 4px; font-size: 11px;
    background: #2a2a2a; color: #e0e0e0; border: 1px solid #555;
    border-radius: 3px; outline: none; cursor: default;
  }
  .panel-dropdown:focus { border-color: #2d6da3; }
  .panel-int2-wrap {
    display: flex; align-items: center; gap: 4px; flex: 1;
  }
  .panel-int-input {
    width: 48px; padding: 2px 4px; font-size: 11px;
    background: #2a2a2a; color: #e0e0e0; border: 1px solid #555;
    border-radius: 3px; outline: none; text-align: right;
  }
  .panel-int-input:focus { border-color: #2d6da3; }
  .panel-preview-text {
    font-size: 11px; color: #999; text-align: center;
    padding: 2px 0; min-height: 16px;
  }
  .unity-tooltip {
    position: fixed;
    z-index: 2000;
    max-width: 420px;
    padding: 6px 10px;
    border: 1px solid #5f5f5f;
    background: #202020;
    color: #e8e8e8;
    font-size: 12px;
    line-height: 1.35;
    border-radius: 2px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    pointer-events: none;
    display: none;
    white-space: normal;
    word-break: break-word;
  }
</style>
</head>
<body>
<div class="main-area" id="mainArea" tabindex="0">
  <div class="placeholder" id="placeholder">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="2" y="3" width="20" height="14" rx="2"/>
      <path d="M8 21h8M12 17v4"/>
    </svg>
    <div>Waiting for stream target...</div>
  </div>
  <video id="remoteVideo" autoplay playsinline></video>
  <canvas id="streamCanvas"></canvas>
  <div id="popupOverlay" class="popup-overlay" style="display:none;"></div>
  <div id="cursorOverlay"></div>
</div>

<script>
(function() {
  const urlParams = new URLSearchParams(window.location.search);
  // When served from Tauri, the native stream server runs on a different origin.
  // Accept ?serverUrl=http://host:port for direct local access, or a same-origin
  // /api/tauri/window-bridge/... path for Tauri/reverse-proxy access.
  function sanitizeServerUrl(raw) {
    if (!raw) return null;
    try {
      var u = new URL(raw, window.location.origin);
      var isLoopback =
        u.hostname === 'localhost' ||
        u.hostname === '127.0.0.1' ||
        u.hostname === '::1';
      var isWindowBridgeProxy =
        u.pathname.indexOf('/api/tauri/window-bridge/') === 0;
      var isCloudCoworkWindowBridgeProxy =
        /^\/api\/cloud-cowork\/window-bridge\/[^/]+\/[^/]+\/?$/.test(
          u.pathname,
        );
      if (
        u.origin === window.location.origin &&
        (isWindowBridgeProxy || isCloudCoworkWindowBridgeProxy)
      ) {
        return (u.pathname + u.search).replace(/\/$/, '');
      }
      if (isLoopback) {
        return (
          u.origin + (isWindowBridgeProxy ? u.pathname + u.search : '')
        ).replace(/\/$/, '');
      }
      console.warn('[WindowBridge] Rejected serverUrl:', raw);
      return null;
    } catch (e) {
      console.warn('[WindowBridge] Invalid serverUrl:', raw, e);
      return null;
    }
  }
  const EXTERNAL_API = sanitizeServerUrl(urlParams.get('serverUrl'));
  const IS_FILL_MODE = urlParams.get('displayMode') === 'fill';
  const LOCAL_API = EXTERNAL_API || (IS_FILL_MODE ? '' : window.location.origin);
  let API = LOCAL_API;
  function updateServerApi(raw) {
    var nextApi = sanitizeServerUrl(raw);
    if (!nextApi) return false;
    API = nextApi;
    urlRefreshRequested = false;
    consecutiveHealthFailures = 0;
    return true;
  }
  function apiFetch(path, opts) {
    if (!API) {
      requestParentUrlRefresh();
      return Promise.reject(new Error('Window bridge server URL is unavailable'));
    }
    return fetch(API + path, opts);
  }
  function isRemoteWindowBridgeApi(api) {
    return typeof api === 'string' && (
      api.indexOf('/api/tauri/window-bridge/remote/') >= 0 ||
      api.indexOf('/api/cloud-cowork/window-bridge/') >= 0
    );
  }
  const $ = (id) => document.getElementById(id);

  // The page is always embedded in the right sidebar and receives stream targets
  // from parentPanel via `unity-window/switch-stream`.
  let autoWindowType = '';
  let compositeLayout = null;
  let activeCompositeSlotId = '';

  const style = document.createElement('style');
  style.textContent = `
    #remoteVideo, #streamCanvas {
      max-width: none !important; max-height: none !important;
      width: 100% !important; height: 100% !important;
      object-fit: fill !important;
      position: absolute !important;
      inset: 0 !important;
    }
    .main-area {
      align-items: stretch !important;
      justify-content: stretch !important;
    }
  `;
  document.head.appendChild(style);

  // Notify native stream server when panel size changes so Unity can resize its RT.
  // Use a short debounce + dedupe so Windows can converge quickly without spamming.
  let resizeTimer = null;
  let pendingResizeW = 0;
  let pendingResizeH = 0;
  let lastSentResizeW = 0;
  let lastSentResizeH = 0;
  function flushPendingResize() {
    if (pendingResizeW <= 0 || pendingResizeH <= 0) return;
    if (pendingResizeW === lastSentResizeW && pendingResizeH === lastSentResizeH) return;
    const sendW = pendingResizeW;
    const sendH = pendingResizeH;
    lastSentResizeW = sendW;
    lastSentResizeH = sendH;
    apiFetch('/stream/resize', {

    if (pointerLocked && !wasLocked) {

  function encodeCompactImageDataUrl(frameW, frameH, drawFrame) {
    // Keep source capture reasonably small; GUI writes this to local file.
    const MAX_EDGE = 1280;
    const JPEG_QUALITY = 0.82;

    const scale = Math.min(1, MAX_EDGE / Math.max(frameW, frameH));
    const shot = document.createElement('canvas');
    shot.width = Math.max(1, Math.round(frameW * scale));
    shot.height = Math.max(1, Math.round(frameH * scale));
    const shotCtx = shot.getContext('2d');
    if (!shotCtx) throw new Error('Screenshot canvas context unavailable');

    drawFrame(shotCtx, shot.width, shot.height);
    return shot.toDataURL('image/jpeg', JPEG_QUALITY);
  }

      return encodeCompactImageDataUrl(
        remoteVideo.videoWidth,
        remoteVideo.videoHeight,
        (shotCtx, outW, outH) => {
          shotCtx.drawImage(remoteVideo, 0, 0, outW, outH);
        }
      );
    }

    // Fallback for non-WebRTC/canvas rendering paths.
    if (canvas && canvas.style.display !== 'none' && canvas.width > 0 && canvas.height > 0) {

        canvas.width,
        canvas.height,
        (shotCtx, outW, outH) => {

        }

  function notifyParentStreamStatus(status, reason) {

  async function measureSignalingLatencyMs() {
    var start = performance.now();
    var ok = await checkHealth();
    if (!ok) return null;
    return Math.max(0, Math.round(performance.now() - start));
  }

  function extractRttMsFromStats(stats) {
    var selectedPairId = null;
    var rttMs = null;
    stats.forEach(function(report) {
      if (report.type === 'transport' && report.selectedCandidatePairId) {
        selectedPairId = report.selectedCandidatePairId;
      }
    });
    stats.forEach(function(report) {
      if (report.type === 'candidate-pair') {
        var isActivePair = selectedPairId
          ? report.id === selectedPairId
          : report.state === 'succeeded' && (report.selected || report.nominated);
        if (
          isActivePair &&
          typeof report.currentRoundTripTime === 'number' &&
          !isNaN(report.currentRoundTripTime)
        ) {
          rttMs = Math.round(report.currentRoundTripTime * 1000);
        }
      }
      if (
        report.type === 'remote-inbound-rtp' &&
        typeof report.roundTripTime === 'number' &&
        !isNaN(report.roundTripTime)
      ) {
        rttMs = Math.round(report.roundTripTime * 1000);
      }
    });
    return rttMs;
  }

  async function collectStreamMetrics() {
    if (!capturing) return;
    try {
      var rttMs = null;
      var jitterMs = null;
      var packetsLost = null;
      if (pc) {
        var stats = await pc.getStats();
        rttMs = extractRttMsFromStats(stats);
        stats.forEach(function(report) {
          if (report.type === 'inbound-rtp' && report.kind === 'video') {
            if (typeof report.jitter === 'number' && report.jitter >= 0) {
              jitterMs = Math.round(report.jitter * 1000);
            }
            if (typeof report.packetsLost === 'number') {
              packetsLost = report.packetsLost;
            }
          }
        });
      }
      // Local/host ICE often omits currentRoundTripTime — fall back to signaling health RTT.
      if (rttMs == null) {
        rttMs = await measureSignalingLatencyMs();
      }
      notifyParentStreamMetrics({
        rttMs: rttMs,
        jitterMs: jitterMs,
        packetsLost: packetsLost,
      });
    } catch (e) { /* ignore stats errors */ }
  }

  // =================== WebRTC ===================

  async function startWebRTC() {
    log('Starting WebRTC connection (server-offer model)...', 'info');
    notifyParentStreamStatus('connecting');

    // Fetch ICE servers from native signaling server.
    let iceServers = [];
    try {
      const iceResp = await fetchJson('/ice-servers');
      if (iceResp && iceResp.iceServers) {
        iceServers = iceResp.iceServers.map(function(s) {
          if (typeof s !== 'string') return s;
          // Parse TURN/TURNS URIs with embedded credentials:
          //   turn://user:pass@host?transport=tcp
          //   turns://user:pass@host:port
          // RTCPeerConnection requires username/credential as separate fields.
          var m = s.match(/^(turns?):\/\/([^:]+):([^@]+)@(.+)$/);
          if (m) {
            return {
              urls: m[1] + ':' + m[4],
              username: decodeURIComponent(m[2]),
              credential: decodeURIComponent(m[3])
            };
          }
          return { urls: s };
        }).filter(function(s) {
          return s && (typeof s.urls === 'string' || Array.isArray(s.urls));
        });
        log('ICE servers: ' + JSON.stringify(iceResp.iceServers), 'info');

        canvas.style.display = 'none';
        placeholder.style.display = 'none';

        ev.track.onmute = () => log('Video track muted', 'err');
        ev.track.onunmute = () => log('Video track unmuted (receiving data)', 'ok');

        let checkCount = 0;
        const frameChecker = setInterval(() => {
          checkCount++;
          const w = remoteVideo.videoWidth;
          const h = remoteVideo.videoHeight;
          const readyState = remoteVideo.readyState;
          log('Video check #' + checkCount + ': ' + w + 'x' + h +
              ' ready=' + readyState +
              ' track=' + ev.track.readyState +
              ' muted=' + ev.track.muted, 'info');

          if (w > 0 && h > 0) {

          }

            clearInterval(frameChecker);
          }

      if (ev.candidate) {

          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            candidate: ev.candidate.candidate,
            sdpMid: ev.candidate.sdpMid,
            sdpMLineIndex: ev.candidate.sdpMLineIndex
          })
        });
      }
    };

    pc.onconnectionstatechange = () => {
      log('PC state: ' + pc.connectionState, 'info');
      if (pc.connectionState === 'connected') {
        log('WebRTC connected successfully', 'ok');
        reconnectAttempt = 0;
        resumeAttempt = 0;
        cancelReconnect();
        stallCheckCount = 0;
        lastFramesDecoded = 0;
        // During domain reload, PC stays connected (C++ native singleton
        // keeps WebRTC alive). Only notify streaming if not reloading —
        // trackWebRTCFps and domain_reload_complete handle the reload case.
        if (!domainReloading && lastReportedStreamStatus !== 'streaming') {
          notifyParentStreamStatus('streaming');
        }
      }
      if (pc.connectionState === 'failed') {
        log('WebRTC connection failed — will auto-reconnect', 'err');
        notifyParentStreamStatus('reconnecting');
        scheduleReconnect(0);
      }
      if (pc.connectionState === 'disconnected') {
        log('WebRTC disconnected — waiting 3s before reconnect', 'err');
        notifyParentStreamStatus('disconnected');
        scheduleReconnect(RECONNECT_BASE_DELAY_MS);
      }
    };

    // Server creates the DataChannel in its offer; receive it here.
    pc.ondatachannel = (event) => {
      inputChannel = event.channel;
      inputChannel.onopen = () => {
        log('Input DataChannel opened (label=' + inputChannel.label + ')', 'ok');
        detectAndReportConnectionType();
      };
      inputChannel.onclose = () => log('Input DataChannel closed', 'err');
      inputChannel.onerror = (e) => log('Input DataChannel error: ' + e.message, 'err');
      // Handle server-to-browser messages (popup data, etc.)

            lastHeartbeatAckTime = Date.now();
            cppAlive = true;
            return;
          }
          const msg = JSON.parse(msgEvt.data);
          if (msg.type === 'popup_payload_begin') handlePopupPayloadBegin(msg);
          else if (msg.type === 'popup_payload_chunk') handlePopupPayloadChunk(msg);
          else if (msg.type === 'popup_payload_end') handlePopupPayloadEnd(msg);
          else handleServerDcMessage(msg);
        } catch (e) {
          log('DC onmessage error: ' + e.message + ' data=' + String(msgEvt.data).substring(0, 200), 'err');
        }
      };
    };

    // Step 1: Request the server-generated offer.
    const serverOffer = await fetchJson('/signaling/offer', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({})
    });

    if (!serverOffer || !serverOffer.sdp) {
      log('WebRTC signaling: no server offer: ' + JSON.stringify(serverOffer), 'err');
      throw new Error('Signaling failed: no server offer (backend may be unreachable)');
    }

    log('Server offer received (' + serverOffer.sdp.length + ' bytes)', 'info');

    // Step 2: Set server offer as remote description.
    log('Setting remote description (offer)...', 'info');
    await pc.setRemoteDescription({ type: 'offer', sdp: serverOffer.sdp });

    // Step 3: Create answer and set as local description.
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);

    // Log the answer SDP to check codec negotiation.
    const answerLines = answer.sdp.split('\n');
    for (const line of answerLines) {
      if (line.startsWith('a=rtpmap') || line.startsWith('a=fmtp') || line.startsWith('m=video') || line.startsWith('m=audio')) {

      }
    }

    const ansResp = await fetchJson('/signaling/answer', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ sdp: answer.sdp, type: 'answer' })
    });

      startIcePolling();

      // Periodically check WebRTC stats for incoming RTP packets.
      let statsCheckCount = 0;
      const statsInterval = setInterval(async () => {
        statsCheckCount++;
        if (!pc || statsCheckCount > 15) { clearInterval(statsInterval); return; }
        try {
          const stats = await pc.getStats();
          stats.forEach(report => {
            if (report.type === 'inbound-rtp' && report.kind === 'video') {
              log('Video RTP: pkts=' + report.packetsReceived +
                  ' bytes=' + report.bytesReceived +
                  ' frames=' + (report.framesDecoded || 0) +
                  ' keysDecoded=' + (report.keyFramesDecoded || 0) +
                  ' lost=' + report.packetsLost +
                  ' jitter=' + (report.jitter || 0) +
                  ' decoderImpl=' + (report.decoderImplementation || '?'), 'info');
            }
            if (report.type === 'inbound-rtp' && report.kind === 'audio') {
              log('Audio RTP: pkts=' + report.packetsReceived +
                  ' bytes=' + report.bytesReceived +
                  ' lost=' + report.packetsLost +
                  ' jitter=' + (report.jitter || 0), 'info');
            }
            if (report.type === 'codec' && report.mimeType) {
              log('Codec: ' + report.mimeType + ' pt=' + report.payloadType +
                  ' sdpFmtp=' + (report.sdpFmtpLine || 'none'), 'info');
            }
          });
        } catch(e) {}
      }, 2000);

    } else {
      log('Failed to send answer: ' + JSON.stringify(ansResp), 'err');
    }
  }

  function startIcePolling() {
    stopIcePolling();
    async function poll() {
      const candidates = await fetchJson('/signaling/ice');
      if (candidates && Array.isArray(candidates)) {
        for (const c of candidates) {
          if (c.candidate) {
            try {
              await pc.addIceCandidate({ candidate: c.candidate, sdpMid: c.sdpMid || '' });
            } catch(e) { /* ignore */ }
          }
        }
      }
      if (capturing) icePollingTimer = setTimeout(poll, 500);
    }
    poll();
  }

  function stopIcePolling() {
    if (icePollingTimer) { clearTimeout(icePollingTimer); icePollingTimer = null; }
  }

  // Detect whether this is a remote streaming session and inform the Unity
  // server via DataChannel so it can choose the correct mouse delta path.
  // The Tauri proxy uses distinct URL patterns:
  //   /api/tauri/window-bridge/local/:token  → local streaming
  //   /api/tauri/window-bridge/remote/:token → remote streaming
  // Only the "remote" variant means the physical mouse is on another machine.
  function detectAndReportConnectionType() {
    try {
      var isRemote = isRemoteWindowBridgeApi(API);
      isRemoteConnection = isRemote;
      log('Connection type: remote=' + isRemote +
          ' API=' + (API || '(none)').substring(0, 80), 'info');
      if (inputChannel && inputChannel.readyState === 'open') {
        inputChannel.send(JSON.stringify({
          type: 'connection_info', remote: isRemote
        }));
        log('Sent connection_info: remote=' + isRemote, 'ok');
      } else {
        log('connection_info NOT sent: DataChannel not open', 'err');
      }
    } catch (e) {
      log('detectConnectionType error: ' + (e.message || e), 'err');
    }
  }

  function closeWebRTC() {
    stopIcePolling();
    if (inputChannel) { try { inputChannel.close(); } catch(e) {} inputChannel = null; }
    if (pc) { try { pc.close(); } catch(e) {} pc = null; }
    remoteVideo.style.display = 'none';
    remoteVideo.srcObject = null;
  }

  // =================== WebRTC Auto-Reconnect ===================

  function cancelReconnect() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  }

  function scheduleReconnect(delayMs) {
    if (!capturing) return;
    // During domain reload the URL refresh handles recovery; skip reconnect.
    if (domainReloading) return;
    cancelReconnect();
    if (reconnectAttempt >= RECONNECT_MAX_ATTEMPTS) {
      log('Auto-reconnect gave up after ' + RECONNECT_MAX_ATTEMPTS + ' attempts', 'err');
      return;
    }
    var delay = delayMs > 0 ? delayMs : Math.min(
      RECONNECT_BASE_DELAY_MS * Math.pow(2, reconnectAttempt),
      RECONNECT_MAX_DELAY_MS
    );
    log('Scheduling WebRTC reconnect #' + (reconnectAttempt + 1) + ' in ' + delay + 'ms', 'info');
    reconnectTimer = setTimeout(function() { reconnectTimer = null; doReconnect(); }, delay);
  }

  var consecutiveSignalingFailures = 0;
  const SIGNALING_FAILURES_BEFORE_URL_REFRESH = 3;

  async function doReconnect() {
    if (!capturing) return;
    if (domainReloading) {
      log('Skip reconnect during domain reload (server/capture auto-resume handles recovery)', 'info');
      return;
    }
    reconnectAttempt++;
    log('WebRTC reconnect attempt #' + reconnectAttempt, 'info');
    notifyParentStreamStatus('reconnecting');

    // Wait for HTTP server to be reachable (C++ server may need a moment after domain reload)
    var healthy = await checkHealth();
    if (!healthy) {
      log('Server not reachable, retrying...', 'err');
      scheduleReconnect(0);
      return;
    }

    // If we were in offscreen mode, re-send the start-offscreen request.
    // After domain reload, C# may have stopped pushing frames and C++ offscreen
    // mode may have ended. Re-sending ensures the pipeline is fully restarted.
    if (activeOffscreenWindowType) {
      log('Re-sending offscreen start for: ' + activeOffscreenWindowType, 'info');
      var fps = STREAM_FPS;
      var sz = getMainAreaSizeForStream();
      var resumeEndpoint = activeOffscreenWindowType === '__composite__'
        ? '/stream/start-composite'
        : '/stream/start-offscreen';
      var resumeBody = activeOffscreenWindowType === '__composite__'
        ? buildCompositeRequestPayload(sz)
        : {
          fps: fps,
          width: sz.width,
          height: sz.height,
          dpr: sz.dpr,
          windowType: activeOffscreenWindowType
        };
      await fetchJson(resumeEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(resumeBody)
      });
    }

    // Tear down old WebRTC connection
    closeWebRTC();

    // Re-establish WebRTC session
    try {
      await startWebRTC();
      trackWebRTCFps();
      log('WebRTC reconnect successful', 'ok');
      resumeAttempt = 0;
      consecutiveSignalingFailures = 0;
    } catch (e) {
      log('WebRTC reconnect failed: ' + e.message, 'err');
      consecutiveSignalingFailures++;
      // The /health endpoint may be served by the Tauri proxy itself and
      // returns OK even when the Unity backend is unreachable (502 on
      // signaling). After repeated signaling failures, ask the parent to
      // re-resolve the stream URL so we get a fresh proxy session.
      if (consecutiveSignalingFailures >= SIGNALING_FAILURES_BEFORE_URL_REFRESH) {
        log('Signaling failed ' + consecutiveSignalingFailures + ' times — requesting URL refresh', 'err');
        requestParentUrlRefresh();
      }
      scheduleReconnect(0);
    }
  }

  // Detect zombie connections: WebRTC reports "connected" but no video frames arrive.
  // This can happen when C# stops pushing frames after domain reload but the DTLS
  // session hasn't timed out yet.
  function startStallDetection() {
    stallCheckCount = 0;
    lastFramesDecoded = 0;
  }

  // Check if C++ is still responding to heartbeat (independent of C# main thread).
  function isCppAlive() {
    if (!cppAlive) return false;
    return (Date.now() - lastHeartbeatAckTime) < CPP_ALIVE_TIMEOUT_MS;
  }

  async function checkVideoStall() {
    if (!capturing || !pc) return;
    try {
      var stats = await pc.getStats();
      var currentFrames = 0;
      stats.forEach(function(report) {
        if (report.type === 'inbound-rtp' && report.kind === 'video') {
          currentFrames = report.framesDecoded || 0;
        }
      });
      if (currentFrames > 0 && currentFrames === lastFramesDecoded) {
        stallCheckCount++;

        // If C++ is responding to heartbeats, the stall is caused by the
        // C# main thread being temporarily blocked (compilation, asset
        // import, modal dialog, etc.). Suppress resume/reconnect — frames
        // will resume automatically once C# unblocks. Attempting to resume
        // while blocked is pointless and can cause cascading side-effects.
        if (isCppAlive()) {
          if (stallCheckCount === 3) {
            notifyParentStreamStatus('unity_busy');
            log('Frames stalled but C++ is alive (heartbeat_ack OK) — Unity main thread likely busy, waiting...', 'info');
          }
          if (stallCheckCount % 15 === 0) {
            log('Still waiting for Unity main thread (' + (stallCheckCount * 2) + 's), C++ heartbeat_ack alive', 'info');
          }
          lastFramesDecoded = currentFrames;
          return;
        }

        // C++ is NOT responding — connection may be truly dead.
        if (stallCheckCount === 3) {
          notifyParentStreamStatus('stalled');
          log('Early stall detected (' + stallCheckCount + ' checks, no heartbeat_ack), trying fast offscreen resume', 'info');
          tryResumeOffscreen();
        }
        if (stallCheckCount >= STALL_THRESHOLD) {
          log('Video stall detected (' + stallCheckCount + ' checks, stuck at ' + currentFrames + ' frames) — resuming offscreen', 'err');
          stallCheckCount = 0;
          tryResumeOffscreen();
          return;
        }
      } else {
        if (currentFrames > lastFramesDecoded) {
          if (domainReloading) {
            if (stallCheckCount > 0) {
              // Frames were stalled (C# unloaded) and are now resuming
              // (C# reloaded) — this is a true reload complete signal.
              // log('Frame recovery after stall during domain reload — reload confirmed', 'info');
              resumeAttempt = 0;
              domainReloading = false;
              stallCheckCount = 0;
              if (lastReportedStreamStatus !== 'streaming') {
                notifyParentStreamStatus('streaming');
              }
            } else {
              // Pre-unload frame growth — OnBeforeAssemblyReload fired but
              // C# hasn't actually unloaded yet. Ignore.
              log('Frame growth during domain reload — ignoring (pre-unload, stallCount=0)', 'info');
            }
          } else {
            resumeAttempt = 0;
            if (lastReportedStreamStatus !== 'streaming') {
              notifyParentStreamStatus('streaming');
            }
          }
        } else if (stallCheckCount >= 3 && !domainReloading) {
          notifyParentStreamStatus('streaming');
        }
        // During domain reload, don't reset stallCheckCount on pre-unload
        // frame growth — we need it to detect the stall when C# unloads.
        if (!domainReloading) {
          stallCheckCount = 0;
        }
      }
      lastFramesDecoded = currentFrames;
    } catch (e) { /* ignore stats errors */ }
  }

  // Resume offscreen frame pushing without rebuilding WebRTC.
  // If resume alone doesn't work (e.g. WebRTC session is truly dead),
  // fall back to full doReconnect after a second stall cycle.
  let resumeAttempt = 0;
  const MAX_RESUME_ATTEMPTS = 2;
  async function tryResumeOffscreen() {
    if (domainReloading) {
      // During domain reload, C# auto-restore rebinds capture after assemblies
      // are back. Avoid sending redundant start-* requests from the browser.
      log('Skip offscreen resume request during domain reload', 'info');
      return;
    }
    if (!activeOffscreenWindowType) {
      // Not in offscreen mode — fall back to full reconnect
      scheduleReconnect(0);
      return;
    }
    resumeAttempt++;
    if (resumeAttempt > MAX_RESUME_ATTEMPTS) {
      log('Resume failed after ' + MAX_RESUME_ATTEMPTS + ' attempts, doing full WebRTC reconnect', 'err');
      resumeAttempt = 0;
      scheduleReconnect(0);
      return;
    }
    log('Resuming offscreen capture (attempt ' + resumeAttempt + '): ' + activeOffscreenWindowType, 'info');
    notifyParentStreamStatus('reconnecting');
    var fps = STREAM_FPS;
    var sz = getMainAreaSizeForStream();
    try {
      var resumeEndpoint = activeOffscreenWindowType === '__composite__'
        ? '/stream/start-composite'
        : '/stream/start-offscreen';
      var resumeBody = activeOffscreenWindowType === '__composite__'
        ? buildCompositeRequestPayload(sz)
        : {
          fps: fps,
          width: sz.width,
          height: sz.height,
          dpr: sz.dpr,
          windowType: activeOffscreenWindowType
        };
      await fetchJson(resumeEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(resumeBody)
      });
      log('Offscreen resume request sent', 'ok');
    } catch (e) {
      log('Offscreen resume failed: ' + e.message + ', will try full reconnect', 'err');
      scheduleReconnect(0);
    }
  }

  function startHeartbeat() {
    if (heartbeatTimer) return;
    startStallDetection();
    void collectStreamMetrics();
    heartbeatTimer = setInterval(() => {
      if (!capturing || typeof sendInput !== 'function') return;
      sendInput({ type: 'heartbeat' });
      // Piggyback stall detection on the heartbeat interval
      checkVideoStall();
      void collectStreamMetrics();
    }, 2000);
  }

  function stopHeartbeat() {
    if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
  }

  // Video element FPS tracking for WebRTC mode.
  function trackWebRTCFps() {
    if (!capturing) return;
    const v = remoteVideo;
    if (v.videoWidth > 0 && lastReportedStreamStatus !== 'streaming' && !domainReloading) {
      notifyParentStreamStatus('streaming');
    }
    requestAnimationFrame(trackWebRTCFps);
  }

  // =================== Control ===================

  function getMainAreaSizeForStream() {
    const area = $('mainArea');
    if (!area) return { width: 0, height: 0, dpr: 1 };
    const rect = area.getBoundingClientRect();
    return {
      width: Math.max(0, Math.round(rect.width)),
      height: Math.max(0, Math.round(rect.height)),
      dpr: window.devicePixelRatio || 1
    };
  }

  async function stopCapture() {
    capturing = false;
    activeOffscreenWindowType = '';
    compositeLayout = null;
    activeCompositeSlotId = '';
    currentWindowType = '';
    serverEditorCursor = 'default';
    clearDragCursorLock();
    gameCursorLocked = false;
    exitGamePointerLock();
    cppAlive = false;
    lastHeartbeatAckTime = 0;
    notifyParentStreamStatus('idle');
    lastReportedMetricsKey = '';
    notifyParentStreamMetrics({ rttMs: null, jitterMs: null, packetsLost: null });
    hideCursorOverlay();
    mainArea.style.cursor = '';
    // Ensure drag state is fully cleared when capture stops unexpectedly.
    dragging = false;
    dragButton = -1;
    if (capturedPointerId !== -1) {
      try { mainArea.releasePointerCapture(capturedPointerId); } catch (_) {}
      capturedPointerId = -1;
    }
    cancelReconnect();
    reconnectAttempt = 0;
    stopHeartbeat();
    serverTooltipText = '';
    hideUnityTooltip();
    closeWebRTC();
    await fetchJson('/stream/stop', { method: 'POST' });
    canvas.style.display = 'none';
    remoteVideo.style.display = 'none';
    placeholder.style.display = 'flex';
    log('Capture stopped (window re-docked if previously undocked)');
    // Fill-only mode: stream target is controlled by parent switch-stream.
  }

    try {

    cursorOverlay.style.backgroundImage = 'url(' + CURSOR_IMAGES[name] + ')';
    // Position relative to mainArea, offset by hotspot.
    var rect = mainArea.getBoundingClientRect();
    cursorOverlay.style.left = (clientX - rect.left - hs.x) + 'px';
    cursorOverlay.style.top  = (clientY - rect.top  - hs.y) + 'px';
    cursorOverlay.style.display = 'block';
    if (!mainArea.classList.contains('cursor-dragging')) {
      mainArea.classList.add('cursor-dragging');
    }
  }
  function moveCursorOverlay(clientX, clientY) {
    if (!activeOverlayCursor) return;
    var hs = CURSOR_HOTSPOTS[activeOverlayCursor] || { x: 16, y: 16 };
    var rect = mainArea.getBoundingClientRect();
    cursorOverlay.style.left = (clientX - rect.left - hs.x) + 'px';
    cursorOverlay.style.top  = (clientY - rect.top  - hs.y) + 'px';
  }
  function hideCursorOverlay() {
    cursorOverlay.style.display = 'none';
    mainArea.classList.remove('cursor-dragging');
    activeOverlayCursor = '';
  }
  function applyEditorCursorFromServer(cursorId) {

    if (!cursorId) cursorId = 'default';
    if (dragging && OVERLAY_CURSOR_KEYS[cursorId])
      dragCursorLock = cursorId;
    serverEditorCursor = cursorId;
    if (gameCursorLocked) return;

    var overlayKey = OVERLAY_CURSOR_KEYS[cursorId];
    if (overlayKey) {
      activeOverlayCursor = overlayKey;
      mainArea.classList.remove('force-editor-cursor');
      mainArea.style.removeProperty('--editor-cursor');

      showCursorOverlay(overlayKey, lastPointerClient.x, lastPointerClient.y);

      mainArea.style.setProperty('--editor-cursor', cssCursor);

        mainArea.style.cursor = 'default';

    function canvasCoords(e) {

      const nw = el.videoWidth || el.width || 0;
      const nh = el.videoHeight || el.height || 0;

      // The element is flex-centered inside mainArea, so its rect gives

      // Use virtual position accumulated from movementX/Y instead.
      const cx = pointerLocked ? virtualClientX : e.clientX;
      const cy = pointerLocked ? virtualClientY : e.clientY;

      const relX = cx - rect.left;
      const relY = cy - rect.top;
      const x = Math.max(0, Math.min(nw - 1, Math.round(relX * nw / rect.width)));
      const y = Math.max(0, Math.min(nh - 1, Math.round(relY * nh / rect.height)));

    let clickLogCount = 0;

      const isAction = data.type !== 'mousemove' && data.type !== 'mousedrag';

        const posInfo = data.type === 'mousedelta'
          ? 'dx=' + (data.dx||0) + ',dy=' + (data.dy||0)
          : '(' + (data.x||0) + ',' + (data.y||0) + ')';

            ' btn=' + (data.button||0) + keyInfo + ' ch=' + (inputChannel ? inputChannel.readyState : 'null'), 'info');
      } else if (inputLogCount <= 10 || inputLogCount % 100 === 0) {

      if (dragCursorLock) applyEditorCursorFromServer(dragCursorLock);

      // capture-phase listener to ensure it works even when another button

      if (remoteDeltaAccumX !== 0 || remoteDeltaAccumY !== 0) flushRemoteDelta();
      // Remember whether this was a left-button drag before resetting state.
      const wasLeftDrag = (dragButton === 0);
      // Always release pointer capture to avoid stuck states.
      if (dragging && capturedPointerId === e.pointerId) {
        try { mainArea.releasePointerCapture(e.pointerId); } catch (_) {}
        dragging = false;
        dragButton = -1;
        capturedPointerId = -1;
        clearDragCursorLock();
      } else if (dragging && capturedPointerId === -1 && dragButton === e.button) {

        dragButton = -1;
        clearDragCursorLock();
      }
      if (currentPopupId || currentPanelId) return;
      if (!capturing) return;
      if (e.button === 1) return;
      const pos = canvasCoords(e);
      // If the pointer moved between pointerdown and pointerup but no
      // mousedrag was sent (browser coalesced/skipped pointermove),
      // synthesize one so the server-side drag detection sees the
      // updated position before mouseup arrives.
      // NOTE: check dragButton BEFORE it was reset above — store it.
      if (wasLeftDrag && !dragSentMove && dragStartCanvasPos) {

        const ddy = pos.y - dragStartCanvasPos.y;
        if (ddx * ddx + ddy * ddy > 25) { // >5px

    mainArea.addEventListener('pointercancel', (e) => {

      // in cross-origin iframes. Input continues via pointermove/pointerup.
    });

    // not fire pointerdown for middle-click when another button is held
    // (e.g., right-click + middle-click combo). Use a mousedown handler
    // in the capture phase to ensure middle-click always reaches Unity.
    // Also prevents browser auto-scroll which consumes the event.
    mainArea.addEventListener('mousedown', (e) => {
      if (e.button === 1) {
        e.preventDefault();
        e.stopPropagation();
        if (!capturing) return;
        const pos = canvasCoords(e);
        sendInput({ type: 'mousedown', x: pos.x, y: pos.y, button: 1,

          shift: e.shiftKey, ctrl: e.ctrlKey, alt: e.altKey, meta: e.metaKey });

    mainArea.addEventListener('mouseup', (e) => {
      if (e.button === 1) {
        e.preventDefault();
        if (!capturing) return;
        const pos = canvasCoords(e);

    mainArea.addEventListener('wheel', (e) => {

          type: 'keyup', key: keySnap, code: codeSnap, keyCode: kcSnap,

  // =================== Frontend Popup Menu ===================
  const popupOverlay = $('popupOverlay');
  let currentPopupId = null;

  let popupSearchDebounce = null;

  let popupInitialPointerUpGuardArmed = false;
  let popupInitialPointerUpGuardUntilMs = 0;

  const kPopupOpeningPointerMaxDeltaPx = 8;
  const popupChunkBufferById = new Map();

  /**
   * Arm a short guard window to swallow the pointerup event that
