  function armPopupInitialPointerUpGuard(data, popupDomPos) {
    popupInitialPointerUpGuardArmed = true;
    popupInitialPointerUpGuardUntilMs = performance.now() + kPopupInitialPointerUpGuardMs;
    popupInitialPointerClient = { x: lastPointerClient.x, y: lastPointerClient.y };
    popupInitialTriggerRect = null;

    const anchorRect = data && data.anchorRect;
    if (anchorRect &&
        Number.isFinite(Number(anchorRect.x)) &&
        Number.isFinite(Number(anchorRect.y)) &&
        Number.isFinite(Number(anchorRect.w)) &&
        Number.isFinite(Number(anchorRect.h)) &&
        Number(anchorRect.w) > 0 &&
        Number(anchorRect.h) > 0) {
      const a = unityPixelToDOM(Number(anchorRect.x), Number(anchorRect.y));
      const b = unityPixelToDOM(Number(anchorRect.x) + Number(anchorRect.w), Number(anchorRect.y) + Number(anchorRect.h));
      const left = Math.min(a.x, b.x);
      const top = Math.min(a.y, b.y);
      const right = Math.max(a.x, b.x);
      const bottom = Math.max(a.y, b.y);
      popupInitialTriggerRect = { left, top, right, bottom };
    } else if (popupDomPos && Number.isFinite(popupDomPos.x) && Number.isFinite(popupDomPos.y)) {
      popupInitialTriggerRect = {
        left: popupDomPos.x - 8,
        top: popupDomPos.y - 10,
        right: popupDomPos.x + 80,
        bottom: popupDomPos.y + 12
      };
    }
  }

  /**
   * Consume the opening click's pointerup to prevent accidental
   * selection of the first popup item.
   * @returns {boolean} true when consumed
   */
  function consumePopupInitialPointerUpIfNeeded(e) {
    if (!popupInitialPointerUpGuardArmed) return false;
    const now = performance.now();
    if (now > popupInitialPointerUpGuardUntilMs) {
      popupInitialPointerUpGuardArmed = false;
      popupInitialPointerClient = null;
      popupInitialTriggerRect = null;
      return false;
    }

    // Always consume within the time window (one-shot).
    // Hitbox check is diagnostic only — never gates the guard.
    const mainRect = mainArea.getBoundingClientRect();
    const x = e.clientX - mainRect.left;
    const y = e.clientY - mainRect.top;
    const nearOpeningPointer = popupInitialPointerClient
      ? (Math.abs(e.clientX - popupInitialPointerClient.x) <= kPopupOpeningPointerMaxDeltaPx &&
         Math.abs(e.clientY - popupInitialPointerClient.y) <= kPopupOpeningPointerMaxDeltaPx)
      : false;
    const inTriggerRect = popupInitialTriggerRect
      ? (x >= popupInitialTriggerRect.left && x <= popupInitialTriggerRect.right &&
         y >= popupInitialTriggerRect.top && y <= popupInitialTriggerRect.bottom)
      : false;
    const reason = nearOpeningPointer ? 'near-pointer' : inTriggerRect ? 'in-trigger' : 'time-only';

    popupInitialPointerUpGuardArmed = false;
    popupInitialPointerClient = null;
    popupInitialTriggerRect = null;
    if (e) {
      e.preventDefault();
      e.stopPropagation();
      if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
    }
    log('Popup guard: ignored opening pointerup (' + reason + ')', 'info');
    return true;
  }

  function handlePopupPayloadBegin(msg) {
    const id = String(msg.id || '');
    const totalChunks = Math.max(1, Number(msg.totalChunks || 0));
    popupChunkBufferById.set(id, {
      totalChunks,
      chunks: new Array(totalChunks),
      received: 0,
      totalBytes: Number(msg.totalBytes || 0)
    });
    log('DC recv popup_payload_begin: id=' + id + ' chunks=' + totalChunks, 'info');
  }

  function handlePopupPayloadChunk(msg) {
    const id = String(msg.id || '');
    const seq = Number(msg.seq || 0);
    const data = String(msg.data || '');
    const state = popupChunkBufferById.get(id);
    if (!state) return;
    if (seq < 0 || seq >= state.totalChunks) return;
    if (state.chunks[seq] === undefined) state.received++;
    state.chunks[seq] = data;
  }

  function handlePopupPayloadEnd(msg) {
    const id = String(msg.id || '');
    const state = popupChunkBufferById.get(id);
    if (!state) return;
    popupChunkBufferById.delete(id);
    if (state.received !== state.totalChunks) {
      log('popup payload incomplete: id=' + id + ' received=' + state.received + '/' + state.totalChunks, 'err');
      return;
    }
    const payloadJson = state.chunks.join('');
    try {
      const payload = JSON.parse(payloadJson);
      log('popup payload assembled: id=' + id + ' bytes=' + payloadJson.length + ' chunks=' + state.totalChunks, 'info');
      handleServerDcMessage(payload);
    } catch (err) {
      log('popup payload parse error: ' + String(err && err.message ? err.message : err), 'err');
    }
  }

  function handleServerDcMessage(msg) {
    if (msg.type === 'popup_show') {
      log('DC recv popup_show: id=' + msg.id + ' items=' + (msg.items ? msg.items.length : 0), 'info');
      showPopupMenu(msg);
    } else if (msg.type === 'popup_hide') {
      log('DC recv popup_hide', 'info');
      hidePopupMenu();
    } else if (msg.type === 'panel_show') {
      log('DC recv panel_show: id=' + msg.id + ' controls=' + (msg.controls ? msg.controls.length : 0), 'info');
      showPanelUI(msg);
    } else if (msg.type === 'panel_hide') {
      log('DC recv panel_hide', 'info');
      hidePanelUI();
    } else if (msg.type === 'tooltip_show') {
      serverTooltipText = msg.text || '';
      if (serverTooltipText) {
        showUnityTooltip(serverTooltipText, lastPointerClient.x, lastPointerClient.y, 120);
      } else {
        hideUnityTooltip();
      }
    } else if (msg.type === 'tooltip_hide') {
      serverTooltipText = '';
      hideUnityTooltip();
    } else if (msg.type === 'editor_windows_changed') {
      log('DC recv editor_windows_changed', 'info');
      window.parent.postMessage({
        source: 'unityWindowBridge',
        messageType: 'unity-window/editor-windows-changed'
      }, '*');
    } else if (msg.type === 'composite_slot_removed') {
      // Unity detected a "Close Tab" action and reports which window type
      // was closed. Forward to parent panel so it can remove the tab before
      // the next composite layout update.
      var removedType = msg.windowType || '';
      log('DC recv composite_slot_removed: ' + removedType, 'info');
      window.parent.postMessage({
        source: 'unityWindowBridge',
        messageType: 'unity-window/slot-removed',
        data: { windowType: removedType }
      }, '*');
    } else if (msg.type === 'composite_layout_snapshot') {
      log('DC recv composite_layout_snapshot: slots=' + (msg.slots ? msg.slots.length : 0), 'info');
      window.parent.postMessage({
        source: 'unityWindowBridge',
        messageType: 'unity-window/composite-layout-snapshot',
        data: { slots: Array.isArray(msg.slots) ? msg.slots : [] }
      }, '*');
    } else if (msg.type === 'domain_reload') {
      // Server stays alive during domain reload (port unchanged, WebRTC persists).
      // No URL refresh needed. Stall detection + tryResumeOffscreen will
      // automatically recover frame pushing after C# finishes reloading.
      log('DC recv domain_reload: assembly reload imminent (server stays alive)', 'info');
      domainReloading = true;
      notifyParentStreamStatus('domain_reloading');
    } else if (msg.type === 'domain_reload_complete') {
      // C# OnDomainReload has finished — domain reload is complete.
      // Reset domainReloading and notify parent immediately.
      log('DC recv domain_reload_complete: domain reload finished', 'info');
      domainReloading = false;
      if (lastReportedStreamStatus !== 'streaming') {
        notifyParentStreamStatus('streaming');
      }
    } else if (msg.type === 'compilation_progress') {
      // Forward compilation progress from Unity Progress API to parent panel.
      // phase: "compiling" (with description), "compile_done" (compilation
      // succeeded — domain_reload will follow from C#), or "failed"
      // (compilation errors — domain reload will NOT happen).
      log('DC recv compilation_progress: phase=' + (msg.phase || 'compiling') + ' desc=' + (msg.description || ''), 'info');
      // On "failed", reset domainReloading since compilation failed and
      // no domain reload will occur.
      if (msg.phase === 'failed') {
        if (domainReloading) {
          domainReloading = false;
          if (lastReportedStreamStatus !== 'streaming') {
            notifyParentStreamStatus('streaming');
          }
        }
      }
      window.parent.postMessage({
        source: 'unityWindowBridge',
        messageType: 'unity-window/compilation-progress',
        data: { phase: msg.phase || 'compiling', description: msg.description || '', errors: msg.errors }
      }, '*');
    } else if (msg.type === 'stream_stop') {
      // Server-initiated stop: the editor explicitly stopped streaming
      // (e.g. user clicked disconnect in the mask window). Set capturing
      // to false so auto-reconnect does NOT fire. Also set
      // serverStoppedStream to suppress health-check-driven URL refresh.
      log('DC recv stream_stop: server requested stop', 'info');
      capturing = false;
      serverStoppedStream = true;
      activeOffscreenWindowType = '';
      compositeLayout = null;
      activeCompositeSlotId = '';
      currentWindowType = '';
      cancelReconnect();
      stopHeartbeat();
      notifyParentStreamStatus('disconnected', 'server_stop');
      closeWebRTC();
      placeholder.style.display = '';
    } else if (msg.type === 'cursor_style') {
      applyEditorCursorFromServer(msg.cursor || 'default');
    } else if (msg.type === 'cursor_lock') {
      // Game runtime changed Cursor.lockState / Cursor.visible.
      // Hide or restore the CSS cursor on the streaming area to match.
      // Only Cursor.visible controls CSS visibility — lockState controls
      // confinement, not visibility. Games may set visible=true while
      // still in Locked mode (e.g. ESC opens a menu with cursor shown).
      var locked = msg.locked;
      var visible = msg.visible;
      log('DC recv cursor_lock: locked=' + locked + ' visible=' + visible, 'info');
      // Hide CSS cursor whenever game is in Locked mode, even if
      // Cursor.visible=true (e.g. ESC pause menu). In Locked+visible
      // the game renders its own software cursor in the video frame
      // and tracks movement via Input.GetAxis deltas (delivered by
      // RIDEV_INPUTSINK from the physical mouse). Showing the CSS
      // cursor would only confuse the user because the OS cursor is
      // confined offscreen by ClipCursor and cannot move.
      if (!visible || locked) {
        mainArea.style.cursor = 'none';
        hideCursorOverlay();
      } else {
        applyEditorCursorFromServer(serverEditorCursor);
      }
      // Pointer Lock: confine OS cursor when game has lockState=Locked
      // and cursor is hidden. This prevents the mouse from leaving the
      // streaming area during gameplay (e.g. FPS aiming).
      // Pointer Lock is requested whenever Cursor.lockState == Locked,
      // regardless of Cursor.visible. Some games use locked+visible for
      // FPS gameplay with a visible crosshair — Pointer Lock is still
      // needed so the browser keeps the mouse confined to the iframe and
      // provides movementX/Y deltas. Without it, the mouse can leave
      // the iframe boundary, causing premature mouseup events.
      // When the game sets Cursor.lockState = None (e.g. after ESC),
      // locked=false and Pointer Lock is released.
      gameCursorLocked = locked;
      if (gameCursorLocked) {
        requestGamePointerLock();
      } else {
        exitGamePointerLock();
      }
    } else {
      log('DC recv unknown: ' + msg.type, 'info');
    }
  }

  /**
   * Convert Unity pixel coordinates to DOM pixel coordinates relative
   * to the mainArea container in fill mode.
   */
  function unityPixelToDOM(ux, uy) {
    const video = remoteVideo;
    if (!video || video.videoWidth === 0 || video.videoHeight === 0) {
      return { x: ux, y: uy };
    }

    const rect = video.getBoundingClientRect();
    const mainRect = mainArea.getBoundingClientRect();
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    const displayW = rect.width;
    const displayH = rect.height;

    // video element offset relative to mainArea
    const videoOffX = rect.left - mainRect.left;
    const videoOffY = rect.top - mainRect.top;

    return {
      x: videoOffX + ux * (displayW / vw),
      y: videoOffY + uy * (displayH / vh)
    };
  }

  /**
   * Compute a robust fallback anchor when Unity sends invalid popup/panel
   * coordinates (typically hidden-window space on Windows offscreen mode).
   * For SceneView toolbar buttons, apply icon half-width compensation so
   * the menu/panel aligns to the button's left edge more strictly.
   * @param {'popup'|'panel'} kind
   * @returns {{x:number,y:number}}
   */
  function getFallbackAnchor(kind) {
    const mainRect = mainArea.getBoundingClientRect();
    const pointerX = Math.max(0, lastPointerClient.x - mainRect.left);
    const pointerY = Math.max(0, lastPointerClient.y - mainRect.top);

    const isSceneView = String(activeOffscreenWindowType || '').indexOf('SceneView') >= 0;
    let leftOffset = 4;
    let downOffset = 8;
    if (isSceneView) {
      // SceneView toolbar trigger buttons are icon buttons (~28-32px wide).
      // Subtract half-width to align popup/panel left edge to button left edge.
      leftOffset = kind === 'panel' ? 16 : 14;
      downOffset = 8;
    }

    return {
      x: Math.max(0, pointerX - leftOffset),
      y: Math.max(0, pointerY + downOffset)
    };
  }

  function applyPopupMenuViewportBounds(menuEl, preferredLeft, preferredTop) {
    const mainRect = mainArea.getBoundingClientRect();
    const padding = 8;
    let left = preferredLeft;
    let top = preferredTop;
    const maxW = Math.max(160, mainRect.width - padding * 2);
    menuEl.style.maxWidth = Math.min(420, maxW) + 'px';

    const isContextMenu = menuEl.classList.contains('popup-menu-context');
    const scrollEl = menuEl.querySelector(':scope > .popup-menu-scroll') || menuEl;

    if (isContextMenu) {
      scrollEl.style.maxHeight = 'none';
      scrollEl.style.overflowY = 'visible';
    } else {
      const spaceBelow = mainRect.height - top - padding;
      const spaceAbove = top - padding;
      const preferredMax = menuEl.classList.contains('popup-menu-annotation') ? 620
        : (menuEl.classList.contains('popup-menu-object-selector') ? 520 : 400);
      let maxHeight = Math.max(120, Math.min(preferredMax, spaceBelow));
      if (maxHeight < 160 && spaceAbove > spaceBelow) {
        maxHeight = Math.max(120, Math.min(preferredMax, spaceAbove));
        const estHeight = Math.min(scrollEl.scrollHeight || maxHeight, maxHeight);
        top = Math.max(padding, top - estHeight);
      }
      scrollEl.style.maxHeight = maxHeight + 'px';
    }

    menuEl.style.left = left + 'px';
    menuEl.style.top = top + 'px';

    const menuRect = menuEl.getBoundingClientRect();
    left = parseFloat(menuEl.style.left);
    top = parseFloat(menuEl.style.top);
    if (left + menuRect.width > mainRect.width - padding) {
      left = Math.max(padding, mainRect.width - menuRect.width - padding);
    }
    if (left < padding) left = padding;
    if (top + menuRect.height > mainRect.height - padding) {
      top = Math.max(padding, mainRect.height - menuRect.height - padding);
    }
    if (top < padding) top = padding;
    menuEl.style.left = left + 'px';
    menuEl.style.top = top + 'px';
  }

  function closeAllFloatingSubmenus() {
    popupOverlay.querySelectorAll('.popup-submenu.popup-submenu-floating').forEach((submenuEl) => {
      submenuEl.style.display = 'none';
    });
    popupOverlay.querySelectorAll('.popup-item-has-submenu.popup-submenu-open').forEach((itemEl) => {
      itemEl.classList.remove('popup-submenu-open');
    });
  }

  function positionFloatingSubmenu(itemEl, submenuEl) {
    const overlayRect = popupOverlay.getBoundingClientRect();
    const mainRect = mainArea.getBoundingClientRect();
    const itemRect = itemEl.getBoundingClientRect();
    const padding = 8;

    submenuEl.style.display = 'block';
    submenuEl.style.maxHeight = '';
    submenuEl.style.left = (itemRect.right - overlayRect.left) + 'px';
    submenuEl.style.top = (itemRect.top - overlayRect.top) + 'px';

    const submenuRect = submenuEl.getBoundingClientRect();
    let left = parseFloat(submenuEl.style.left);
    let top = parseFloat(submenuEl.style.top);

    if (submenuRect.right > mainRect.right - padding) {
      left = itemRect.left - overlayRect.left - submenuRect.width;
    }
    if (left < padding) left = padding;
    submenuEl.style.left = left + 'px';

    const refreshedRect = submenuEl.getBoundingClientRect();
    if (refreshedRect.bottom > mainRect.bottom - padding) {
      top -= refreshedRect.bottom - (mainRect.bottom - padding);
    }
    if (refreshedRect.top < mainRect.top + padding) {
      top += (mainRect.top + padding) - refreshedRect.top;
    }
    submenuEl.style.top = Math.max(0, top) + 'px';

    if (!submenuEl.classList.contains('popup-submenu-context')) {
      const finalRect = submenuEl.getBoundingClientRect();
      const available = mainRect.bottom - padding - finalRect.top;
      submenuEl.style.maxHeight = Math.max(120, Math.min(480, available)) + 'px';
    } else {
      submenuEl.style.maxHeight = 'none';
      submenuEl.style.overflowY = 'visible';
    }
  }

  function closeSiblingFloatingSubmenus(itemEl) {
    const keepSubmenus = new Set();
    let node = itemEl;
    while (node) {
      if (node.classList && node.classList.contains('popup-submenu-floating')) {
        keepSubmenus.add(node);
      }
      node = node.parentElement;
    }
    popupOverlay.querySelectorAll('.popup-submenu.popup-submenu-floating').forEach((el) => {
      if (!keepSubmenus.has(el)) {
        el.style.display = 'none';
      }
    });
    popupOverlay.querySelectorAll('.popup-item-has-submenu.popup-submenu-open').forEach((el) => {
      if (!itemEl.contains(el) && !el.contains(itemEl)) {
        el.classList.remove('popup-submenu-open');
      }
    });
  }

  function openFloatingSubmenu(itemEl, submenuEl) {
    if (popupSubmenuTimer) {
      clearTimeout(popupSubmenuTimer);
      popupSubmenuTimer = null;
    }
    closeSiblingFloatingSubmenus(itemEl);
    if (submenuEl.parentElement !== popupOverlay) {
      popupOverlay.appendChild(submenuEl);
    }
    submenuEl.classList.add('popup-submenu-floating');
    itemEl.classList.add('popup-submenu-open');
    requestAnimationFrame(() => positionFloatingSubmenu(itemEl, submenuEl));
  }

  /**
   * Build Inspector IconSelector popup (GameObject / script icon grid).
   */
  function buildIconSelectorPopup(menuEl, data) {
    menuEl.classList.add('popup-menu-icon-selector');

    let selectedPath = data.selectedPath || '';

    const header = document.createElement('div');
    header.className = 'icon-selector-header';
    const title = document.createElement('span');
    title.textContent = data.title || 'Select Icon';
    header.appendChild(title);
    const noneBtn = document.createElement('button');
    noneBtn.type = 'button';
    noneBtn.className = 'icon-selector-none-btn';
    noneBtn.textContent = 'None';
    header.appendChild(noneBtn);
    menuEl.appendChild(header);

    function appendSep() {
      const sep = document.createElement('div');
      sep.className = 'icon-selector-sep';
      menuEl.appendChild(sep);
    }

    function bindIconButton(btn, path) {
      btn.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        e.preventDefault();
      });
      btn.addEventListener('pointerup', (e) => {
        e.stopPropagation();
        e.preventDefault();
        if (Date.now() - popupShowTime < 350) return;
        selectedPath = path;
        menuEl.querySelectorAll('.icon-selector-icon.selected').forEach((el) => {
          el.classList.remove('selected');
        });
        btn.classList.add('selected');
        sendInput({
          type: 'popup_select',
          id: currentPopupId,
          index: 0,
          path,
        });
      });
    }

    function appendIconGrid(icons) {
      const grid = document.createElement('div');
      grid.className = 'icon-selector-grid';
      (icons || []).forEach((icon) => {
        const btn = document.createElement('img');
        btn.className = 'icon-selector-icon';
        btn.draggable = false;
        btn.alt = icon.path || '';
        if (icon.image) btn.src = icon.image;
        if (icon.path && icon.path === selectedPath) btn.classList.add('selected');
        bindIconButton(btn, icon.path);
        grid.appendChild(btn);
      });
      menuEl.appendChild(grid);
    }

    if (data.showLabelIcons !== false && Array.isArray(data.labelIcons) && data.labelIcons.length > 0) {
      appendSep();
      appendIconGrid(data.labelIcons);
    }

    appendSep();
    appendIconGrid(data.dotIcons || []);

    noneBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      e.preventDefault();
    });
    noneBtn.addEventListener('pointerup', (e) => {
      e.stopPropagation();
      e.preventDefault();
      if (Date.now() - popupShowTime < 350) return;
      selectedPath = '__none__';
      menuEl.querySelectorAll('.icon-selector-icon.selected').forEach((el) => {
        el.classList.remove('selected');
      });
      sendInput({
        type: 'popup_select',
        id: currentPopupId,
        index: 0,
        path: '__none__',
      });
    });
  }

  /**
   * Show a popup menu received from the Unity server.
   * @param {Object} data - popup_show message with id, x, y, items[]
   */
  function showPopupMenu(data) {
    hidePopupMenu(false);
    closeAllFloatingSubmenus();
    currentPopupId = data.id;
    popupShowTime = Date.now();

    // Release any active pointer capture on mainArea so that
    // subsequent pointer events reach the popup overlay / items
    // instead of being routed to mainArea.
    if (capturedPointerId >= 0) {
      try { mainArea.releasePointerCapture(capturedPointerId); } catch (_) {}
      dragging = false;
      dragButton = -1;
      capturedPointerId = -1;
    }

    const menuEl = document.createElement('div');
    menuEl.className = 'popup-menu';
    if (data.sourceType === 'annotation_full') menuEl.classList.add('popup-menu-annotation');
    if (data.sourceType === 'generic_context') menuEl.classList.add('popup-menu-context');
    if (data.sourceType === 'object_selector') menuEl.classList.add('popup-menu-object-selector');
    if (data.sourceType === 'icon_selector') menuEl.classList.add('popup-menu-icon-selector');

    if (data.sourceType === 'icon_selector') {
      buildIconSelectorPopup(menuEl, data);
      const rawUnityX = Number(data.x || 0);
      const rawUnityY = Number(data.y || 0);
      let domPos = unityPixelToDOM(rawUnityX, rawUnityY);
      let anchorSource = 'unity_xy';
      const anchorRect = data.anchorRect || null;
      const ax = Number(anchorRect && anchorRect.x);
      const ay = Number(anchorRect && anchorRect.y);
      const aw = Number(anchorRect && anchorRect.w);
      const ah = Number(anchorRect && anchorRect.h);
      const hasValidAnchorRect =
        Number.isFinite(ax) && Number.isFinite(ay) &&
        Number.isFinite(aw) && Number.isFinite(ah) &&
        aw > 0 && ah > 0;
      if (hasValidAnchorRect) {
        domPos = unityPixelToDOM(ax, ay + ah);
        anchorSource = 'anchor_rect';
      }
      const vw = Math.max(1, Number(remoteVideo.videoWidth || 0));
      const vh = Math.max(1, Number(remoteVideo.videoHeight || 0));
      const unityAnchorLooksInvalid =
        !Number.isFinite(rawUnityX) || !Number.isFinite(rawUnityY) ||
        rawUnityX < -vw || rawUnityY < -vh ||
        rawUnityX > vw * 2 || rawUnityY > vh * 2;
      if (!hasValidAnchorRect && unityAnchorLooksInvalid) {
        domPos = getFallbackAnchor('popup');
        anchorSource = 'pointer_fallback';
      }
      armPopupInitialPointerUpGuard(data, domPos);
      menuEl.style.left = domPos.x + 'px';
      menuEl.style.top = domPos.y + 'px';
      popupOverlay.innerHTML = '';
      popupOverlay.appendChild(menuEl);
      popupOverlay.style.display = 'block';
      requestAnimationFrame(() => {
        applyPopupMenuViewportBounds(menuEl, domPos.x, domPos.y);
      });
      log('Icon selector popup shown: ' + currentPopupId + ' at DOM(' + Math.round(domPos.x) + ',' + Math.round(domPos.y) + ') source=' + anchorSource, 'info');
      return;
    }

    const headerToggles = data.headerToggles || [];
    const headerSliders = data.headerSliders || [];
    const isAnnotationFullPopup = data.sourceType === 'annotation_full';
    if (headerToggles.length > 0) {
      const sliderByKey = {};
      headerSliders.forEach((slider) => { sliderByKey[slider.key] = slider; });

      const headerEl = document.createElement('div');
      headerEl.className = 'popup-header';
      headerToggles.forEach((toggle) => {
        const row = document.createElement('label');
        row.className = 'popup-toggle-row';
        if (isAnnotationFullPopup) row.classList.add('popup-toggle-row-annotation');
        if (!toggle.enabled) row.classList.add('popup-toggle-disabled');
        if (toggle.tooltip) bindTooltip(row, toggle.tooltip);

        const leftWrap = document.createElement('span');
        leftWrap.className = isAnnotationFullPopup ? 'popup-toggle-main' : '';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = toggle.checked;
        cb.disabled = !toggle.enabled;
        cb.addEventListener('change', (e) => {
          e.stopPropagation();
          sendInput({
            type: 'popup_toggle',
            id: currentPopupId,
            key: toggle.key,
            value: cb.checked
          });
          log('Popup toggle: ' + toggle.key + ' = ' + cb.checked, 'info');
        });
        leftWrap.appendChild(cb);
        const span = document.createElement('span');
        span.textContent = toggle.label;
        leftWrap.appendChild(span);
        row.appendChild(leftWrap);

        // For AnnotationWindow, 3D Icons/Fade Gizmos sliders should be on the same row.
        if (isAnnotationFullPopup) {
          const sliderKey = toggle.key === 'use3dGizmos' ? 'iconSize'
            : (toggle.key === 'fadeGizmos' ? 'fadeGizmoSize' : null);
          const slider = sliderKey ? sliderByKey[sliderKey] : null;
          if (slider) {
            const sliderWrap = document.createElement('span');
            sliderWrap.className = 'popup-toggle-slider';
            const input = document.createElement('input');
            input.type = 'range';
            input.min = slider.min !== undefined ? slider.min : 0;
            input.max = slider.max !== undefined ? slider.max : 1;
            input.step = slider.step !== undefined ? slider.step : 0.01;
            input.value = slider.value !== undefined ? slider.value : 0;
            input.disabled = !toggle.enabled || !toggle.checked;
            if (slider.tooltip) bindTooltip(input, slider.tooltip, { delayMs: 120 });
            input.addEventListener('input', (e) => {
              e.stopPropagation();
              const v = parseFloat(input.value) || 0;
              sendInput({ type: 'popup_slider', id: currentPopupId, key: slider.key, value: v });
            });
            input.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
            input.addEventListener('pointerup', (e) => { e.stopPropagation(); });
            sliderWrap.appendChild(input);
            row.appendChild(sliderWrap);
          }
        }

        headerEl.appendChild(row);
      });
      menuEl.appendChild(headerEl);
      const sep = document.createElement('div');
      sep.className = 'popup-separator';
      menuEl.appendChild(sep);
    }

    // Render popup header sliders for non-annotation popups.
    if (headerSliders.length > 0 && !isAnnotationFullPopup) {
      const sliderWrap = document.createElement('div');
      sliderWrap.className = 'popup-header';
      headerSliders.forEach((slider) => {
        const row = document.createElement('div');
        row.className = 'popup-slider-row';
        if (slider.tooltip) bindTooltip(row, slider.tooltip);
        const label = document.createElement('span');
        label.textContent = slider.label || slider.key;
        label.style.minWidth = '72px';
        label.style.fontSize = '11px';
        const input = document.createElement('input');
        input.type = 'range';
        input.min = slider.min !== undefined ? slider.min : 0;
        input.max = slider.max !== undefined ? slider.max : 1;
        input.step = slider.step !== undefined ? slider.step : 0.01;
        input.value = slider.value !== undefined ? slider.value : 0;
        if (slider.tooltip) bindTooltip(input, slider.tooltip, { delayMs: 120 });
        const showValue = slider.showValue !== false;
        const valueEl = document.createElement('span');
        valueEl.className = 'popup-slider-value';
        valueEl.style.display = showValue ? '' : 'none';
        valueEl.textContent = Number(input.value).toFixed(2);
        input.addEventListener('input', (e) => {
          e.stopPropagation();
          const v = parseFloat(input.value) || 0;
          if (showValue) valueEl.textContent = v.toFixed(2);
          sendInput({ type: 'popup_slider', id: currentPopupId, key: slider.key, value: v });
        });
        input.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
        input.addEventListener('pointerup', (e) => { e.stopPropagation(); });
        row.appendChild(label);
        row.appendChild(input);
        row.appendChild(valueEl);
        sliderWrap.appendChild(row);
      });
      menuEl.appendChild(sliderWrap);
      const sep = document.createElement('div');
      sep.className = 'popup-separator';
      menuEl.appendChild(sep);
    }

    // Object picker tabs (Assets / Scene).
    if (Array.isArray(data.tabs) && data.tabs.length > 0) {
      const tabRow = document.createElement('div');
      tabRow.className = 'popup-tab-row';
      data.tabs.forEach((tab) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'popup-tab' + (tab.active ? ' active' : '');
        btn.textContent = tab.label || tab.id || '';
        btn.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          e.preventDefault();
        });
        btn.addEventListener('pointerup', (e) => {
          e.stopPropagation();
          e.preventDefault();
          if (Date.now() - popupShowTime < 350) return;
          sendInput({ type: 'popup_tab', id: currentPopupId, tab: tab.id });
        });
        tabRow.appendChild(btn);
      });
      menuEl.appendChild(tabRow);
      const sep = document.createElement('div');
      sep.className = 'popup-separator';
      menuEl.appendChild(sep);
    }

    // Render popup search input (used by Annotation full popup).
    if (data.searchText !== undefined) {
      const searchRow = document.createElement('div');
      searchRow.className = 'popup-search-row';
      const input = document.createElement('input');
      input.className = 'popup-search-input';
      input.type = 'text';
      input.value = data.searchText || '';
      input.placeholder = 'Search';
      input.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
      input.addEventListener('input', (e) => {
        e.stopPropagation();
        if (popupSearchDebounce) clearTimeout(popupSearchDebounce);
        const value = input.value;
        popupSearchDebounce = setTimeout(() => {
          sendInput({ type: 'popup_search', id: currentPopupId, value });
        }, 120);
      });
      searchRow.appendChild(input);
      menuEl.appendChild(searchRow);
      const sep = document.createElement('div');
      sep.className = 'popup-separator';
      menuEl.appendChild(sep);
    }

    if (isAnnotationFullPopup && data.showColumnHeaders) {
      const colHeader = document.createElement('div');
      colHeader.className = 'popup-column-header';
      const left = document.createElement('span');
      left.className = 'popup-column-header-label';
      left.textContent = '';
      const right = document.createElement('div');
      right.className = 'popup-column-header-right';
      const icon = document.createElement('span');
      icon.className = 'popup-column-header-cell';
      icon.textContent = 'icon';
      const gizmo = document.createElement('span');
      gizmo.className = 'popup-column-header-cell';
      gizmo.textContent = 'gizmo';
      right.appendChild(icon);
      right.appendChild(gizmo);
      colHeader.appendChild(left);
      colHeader.appendChild(right);
      menuEl.appendChild(colHeader);
    }

    const isContextPopup = data.sourceType === 'generic_context';

    /** Unity menus: "Save _%s" or "UI Toolkit Debugger %F5" → label + shortcut. */
    function looksLikeUnityMenuShortcutTail(tail) {
      if (!tail || tail.length < 2) return false;
      let i = 0;
      while (i < tail.length) {
        const c = tail[i];
        if (c === '%' || c === '#' || c === '&' || c === '^' || c === '_') {
          i++;
          continue;
        }
        break;
      }
      if (i >= tail.length || i === 0) return false;
      for (let j = i; j < tail.length; j++) {
        const k = tail[j];
        if (!((k >= 'a' && k <= 'z') || (k >= 'A' && k <= 'Z') || (k >= '0' && k <= '9')))
          return false;
      }
      return true;
    }

    function formatUnityMenuLabel(text) {
      if (!text) return { label: '', shortcut: '' };
      const sep = text.lastIndexOf(' _');
      if (sep >= 0) {
        return {
          label: text.substring(0, sep),
          shortcut: decodeUnityShortcut(text.substring(sep + 2)),
        };
      }
      const space = text.lastIndexOf(' ');
      if (space >= 0) {
        const tail = text.substring(space + 1);
        if (looksLikeUnityMenuShortcutTail(tail)) {
          return {
            label: text.substring(0, space),
            shortcut: decodeUnityShortcut(tail),
          };
        }
      }
      return { label: text, shortcut: '' };
    }

    function decodeUnityShortcut(raw) {
      if (!raw) return '';
      if (raw.length > 1 && raw[0] === '_') raw = raw.substring(1);
      let out = '';
      for (let i = 0; i < raw.length; i++) {
        const c = raw[i];
        if (c === '%' || c === '^') out += 'Ctrl+';
        else if (c === '#') out += 'Shift+';
        else if (c === '&') out += 'Alt+';
        else out += c;
      }
      if (out.endsWith('+')) out = out.slice(0, -1);
      if (out.length >= 2 && out[0] === 'f' && out[1] >= '0' && out[1] <= '9')
        out = out.toUpperCase();
      return out || raw;
    }

    function appendPopupMenuItemLabel(el, displayLabel, shortcut) {
      if (shortcut) {
        el.classList.add('popup-item-has-shortcut');
        const labelSpan = document.createElement('span');
        labelSpan.className = 'popup-item-label';
        labelSpan.textContent = displayLabel;
        const shortcutSpan = document.createElement('span');
        shortcutSpan.className = 'popup-item-shortcut';
        shortcutSpan.textContent = shortcut;
        el.appendChild(labelSpan);
        el.appendChild(shortcutSpan);
      } else {
        el.textContent = displayLabel;
      }
    }

    function appendPopupMenuItems(container, items, isAnnotationFull) {
      (items || []).forEach((item) => {
        if (item.separator) {
          const sep = document.createElement('div');
          sep.className = 'popup-separator';
          container.appendChild(sep);
          return;
        }

        const hasChildren = Array.isArray(item.children) && item.children.length > 0;
        const isSubmenuBranch = hasChildren;
        let displayLabel = item.label || item.path || '';
        let shortcut = item.shortcut || '';
        if (!shortcut && displayLabel) {
          const parsed = formatUnityMenuLabel(displayLabel);
          if (parsed.shortcut) {
            displayLabel = parsed.label;
            shortcut = parsed.shortcut;
          }
        }
        const slashIdx = displayLabel.lastIndexOf('/');
        if (slashIdx >= 0) displayLabel = displayLabel.substring(slashIdx + 1);
        if (!item.separator && !hasChildren && !displayLabel)
          return;

        const el = document.createElement('div');
        const itemEnabled = item.enabled !== false;

        // Section headers: disabled items with index == -1 and empty path.
        if (!itemEnabled && item.index === -1 && !item.path && !hasChildren) {
          el.className = 'popup-section-header';
          el.textContent = item.label || '';
          container.appendChild(el);
          return;
        }

        el.className = 'popup-item';
        if (isAnnotationFull) el.classList.add('popup-item-annotation');
        if (isSubmenuBranch) {
          el.classList.add('popup-item-submenu');
          el.classList.add('popup-item-has-submenu');
        }
        if (!itemEnabled) el.classList.add('popup-item-disabled');
        if (item.tooltip) bindTooltip(el, item.tooltip);
        if (item.checked && !isAnnotationFull) el.classList.add('popup-item-checked');

        if (!isAnnotationFull) {
          appendPopupMenuItemLabel(el, displayLabel, shortcut);
        } else {
          const labelSpan = document.createElement('span');
          labelSpan.className = 'popup-anno-label';
          labelSpan.textContent = displayLabel;
          el.appendChild(labelSpan);
          const right = document.createElement('div');
          right.className = 'popup-anno-toggles';
          if (item.hasIcon) {
            const iconCell = document.createElement('span');
            iconCell.className = 'popup-anno-cell';
            if (item.iconImage) {
              const iconBtn = document.createElement('button');
              iconBtn.className = 'popup-anno-icon-btn';
              const iconImg = document.createElement('img');
              iconImg.src = item.iconImage;
              iconImg.alt = '';
              iconImg.style.opacity = item.iconChecked ? '1' : '0.35';
              if (item.iconTooltip) bindTooltip(iconBtn, item.iconTooltip, { delayMs: 120 });
              iconBtn.appendChild(iconImg);
              iconBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); });
              iconBtn.addEventListener('pointerup', (e) => { e.stopPropagation(); e.preventDefault(); });
              iconBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                e.preventDefault();
                item.iconChecked = !item.iconChecked;
                iconImg.style.opacity = item.iconChecked ? '1' : '0.35';
                sendInput({ type: 'popup_select', id: currentPopupId, index: item.index, path: item.iconPath || '' });
              });
              iconCell.appendChild(iconBtn);
            }
            right.appendChild(iconCell);
          } else {
            const emptyIconCell = document.createElement('span');
            emptyIconCell.className = 'popup-anno-cell';
            right.appendChild(emptyIconCell);
          }
          if (item.hasGizmo) {
            const gizmoCell = document.createElement('span');
            gizmoCell.className = 'popup-anno-cell';
            const gizmoLabel = document.createElement('label');
            gizmoLabel.className = 'popup-anno-toggle';
            const gizmoCb = document.createElement('input');
            gizmoCb.type = 'checkbox';
            gizmoCb.checked = !!item.gizmoChecked;
            if (item.gizmoTooltip) bindTooltip(gizmoCb, item.gizmoTooltip, { delayMs: 120 });
            gizmoCb.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
            gizmoCb.addEventListener('pointerup', (e) => { e.stopPropagation(); e.preventDefault(); });
            gizmoCb.addEventListener('change', (e) => {
              e.stopPropagation();
              sendInput({ type: 'popup_select', id: currentPopupId, index: item.index, path: item.path || '' });
            });
            gizmoLabel.appendChild(gizmoCb);
            gizmoCell.appendChild(gizmoLabel);
            right.appendChild(gizmoCell);
          } else {
            const emptyGizmoCell = document.createElement('span');
            emptyGizmoCell.className = 'popup-anno-cell';
            right.appendChild(emptyGizmoCell);
          }
          el.appendChild(right);
        }

        if (hasChildren) {
          const submenuEl = document.createElement('div');
          submenuEl.className = 'popup-menu popup-submenu';
          if (isContextPopup) submenuEl.classList.add('popup-submenu-context');
          appendPopupMenuItems(submenuEl, item.children, isAnnotationFull);
          el.appendChild(submenuEl);
          el.addEventListener('mouseenter', () => {
            openFloatingSubmenu(el, submenuEl);
          });
          el.addEventListener('mouseleave', () => {
            popupSubmenuTimer = setTimeout(() => {
              if (!submenuEl.matches(':hover') && !el.matches(':hover')) {
                submenuEl.style.display = 'none';
                el.classList.remove('popup-submenu-open');
              }
            }, 120);
          });
          submenuEl.addEventListener('mouseenter', () => {
            if (popupSubmenuTimer) {
              clearTimeout(popupSubmenuTimer);
              popupSubmenuTimer = null;
            }
            el.classList.add('popup-submenu-open');
            submenuEl.style.display = 'block';
          });
          submenuEl.addEventListener('mouseleave', () => {
            popupSubmenuTimer = setTimeout(() => {
              submenuEl.style.display = 'none';
              el.classList.remove('popup-submenu-open');
            }, 120);
          });
        }

        const hasSelectablePath = item.path !== undefined && item.path !== null && String(item.path) !== '';
        const isActionableLeaf = itemEnabled && !isSubmenuBranch && hasSelectablePath;
        if (isActionableLeaf) {
          el.addEventListener('mouseenter', () => { el.classList.add('popup-item-hover'); });
          el.addEventListener('mouseleave', () => { el.classList.remove('popup-item-hover'); });

          el.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            e.preventDefault();
          });
          el.addEventListener('pointerup', (e) => {
            e.stopPropagation();
            e.preventDefault();
            if (Date.now() - popupShowTime < 350) return;
            sendInput({
              type: 'popup_select',
              id: currentPopupId,
              index: item.index,
              path: String(item.path)
            });
            log('Popup select: idx=' + item.index + ' path=' + item.path, 'info');
            if (!item.keepOpen) hidePopupMenu(false);
          });
        } else if (isSubmenuBranch) {
          el.addEventListener('mouseenter', () => { el.classList.add('popup-item-hover'); });
          el.addEventListener('mouseleave', () => { el.classList.remove('popup-item-hover'); });
        }

        container.appendChild(el);
      });
    }

    const menuScrollEl = document.createElement('div');
    menuScrollEl.className = 'popup-menu-scroll';
    appendPopupMenuItems(menuScrollEl, data.items || [], isAnnotationFullPopup);
    menuEl.appendChild(menuScrollEl);

    // Render "+" add button if present.
    if (data.showAddButton) {
      const addEl = document.createElement('div');
      addEl.className = 'popup-item popup-add-btn';
      addEl.textContent = '+';
      bindTooltip(addEl, 'Add New Item');
      addEl.addEventListener('mouseenter', () => { addEl.classList.add('popup-item-hover'); });
      addEl.addEventListener('mouseleave', () => { addEl.classList.remove('popup-item-hover'); });
      addEl.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); });
      addEl.addEventListener('pointerup', (e) => {
        e.stopPropagation();
        e.preventDefault();
        if (Date.now() - popupShowTime < 350) return;
        sendInput({ type: 'popup_select', id: currentPopupId, index: -2, path: '__add__' });
        log('Popup add button clicked', 'info');
        hidePopupMenu(false);
      });
      menuEl.appendChild(addEl);
    }

    const rawUnityX = Number(data.x || 0);
    const rawUnityY = Number(data.y || 0);
    let domPos = unityPixelToDOM(rawUnityX, rawUnityY);
    let anchorSource = 'unity_xy';

    const anchorRect = data.anchorRect || null;
    const ax = Number(anchorRect && anchorRect.x);
    const ay = Number(anchorRect && anchorRect.y);
    const aw = Number(anchorRect && anchorRect.w);
    const ah = Number(anchorRect && anchorRect.h);
    const hasValidAnchorRect =
      Number.isFinite(ax) && Number.isFinite(ay) &&
      Number.isFinite(aw) && Number.isFinite(ah) &&
      aw > 0 && ah > 0;
    if (hasValidAnchorRect) {
      domPos = unityPixelToDOM(ax, ay + ah);
      anchorSource = 'anchor_rect';
    }

    // Windows offscreen mode can report popup anchors in hidden-window
    // screen space (e.g. ~32000,32000). When that happens, anchor the menu
    // to the latest pointer position so it stays near the clicked toolbar button.
    const vw = Math.max(1, Number(remoteVideo.videoWidth || 0));
    const vh = Math.max(1, Number(remoteVideo.videoHeight || 0));
    const unityAnchorLooksInvalid =
      !Number.isFinite(rawUnityX) || !Number.isFinite(rawUnityY) ||
      rawUnityX < -vw || rawUnityY < -vh ||
      rawUnityX > vw * 2 || rawUnityY > vh * 2;
    if (!hasValidAnchorRect && unityAnchorLooksInvalid) {
      domPos = getFallbackAnchor('popup');
      anchorSource = 'pointer_fallback';
      log('Popup anchor fallback: unity=(' + Math.round(rawUnityX) + ',' + Math.round(rawUnityY) +
          ') pointer=(' + Math.round(domPos.x) + ',' + Math.round(domPos.y) + ')', 'info');
    }
    armPopupInitialPointerUpGuard(data, domPos);

    menuEl.style.left = domPos.x + 'px';
    menuEl.style.top = domPos.y + 'px';

    popupOverlay.innerHTML = '';
    popupOverlay.appendChild(menuEl);
    popupOverlay.style.display = 'block';

    // Fit within the stream viewport; context menus grow to full content height.
    requestAnimationFrame(() => {
      applyPopupMenuViewportBounds(menuEl, domPos.x, domPos.y);
    });

    const itemCount = (data.items || []).length;
    log('Popup shown: ' + currentPopupId + ' (' + itemCount + ' items) at DOM(' + Math.round(domPos.x) + ',' + Math.round(domPos.y) + ') source=' + anchorSource, 'info');
  }

  // All pointer events on the overlay (and its children) must be
  // captured here to prevent them from bubbling up to mainArea,
  // which would either close the popup prematurely or inject Unity
  // input events while the popup is open.
  popupOverlay.addEventListener('pointerdown', (e) => {
    if (e.target !== popupOverlay) {
      e.stopPropagation();
      e.preventDefault();
      return;
    }
    e.stopPropagation();
    e.preventDefault();
    // Click on the transparent overlay background closes the popup/panel.
    if (e.target === popupOverlay) {
      if (currentPopupId) hidePopupMenu(true);
      if (currentPanelId) {
        sendInput({ type: 'panel_close', id: currentPanelId });
        log('Panel close sent (overlay click): ' + currentPanelId, 'info');
        hidePanelUI();
      }
    }
  });
  popupOverlay.addEventListener('pointerup', (e) => {
    if (consumePopupInitialPointerUpIfNeeded(e)) return;
  }, true);
  popupOverlay.addEventListener('pointerup', (e) => {
    if (consumePopupInitialPointerUpIfNeeded(e)) return;
    if (e.target !== popupOverlay) return;
    e.stopPropagation();
    e.preventDefault();
  });
  popupOverlay.addEventListener('pointermove', (e) => {
    e.stopPropagation();
  });
  popupOverlay.addEventListener('wheel', (e) => {
    if (e.target === popupOverlay) {
      e.stopPropagation();
      return;
    }
    // Allow wheel scrolling inside popup menus/submenus.
    e.stopPropagation();
  }, { passive: true });

  /**
   * Hide the popup menu and optionally notify the server.
   * @param {boolean} notify - if true, send popup_close to server
   */
  function hidePopupMenu(notify) {
    hideUnityTooltip();
    closeAllFloatingSubmenus();
    if (popupSubmenuTimer) { clearTimeout(popupSubmenuTimer); popupSubmenuTimer = null; }
    if (popupSearchDebounce) { clearTimeout(popupSearchDebounce); popupSearchDebounce = null; }
    popupInitialPointerUpGuardArmed = false;
    popupInitialPointerClient = null;
    popupInitialTriggerRect = null;
    popupOverlay.style.display = 'none';
    popupOverlay.innerHTML = '';

    if (notify && currentPopupId) {
      sendInput({ type: 'popup_close', id: currentPopupId });
      log('Popup close sent: ' + currentPopupId, 'info');
    }
    currentPopupId = null;
  }

  // =================== Frontend Panel UI ===================
  let currentPanelId = null;

  /**
   * Render an interactive panel (e.g. Grid Settings) received from Unity.
   * The panel supports button_strip, slider, and button control types.
   * @param {Object} data - panel_show message with id, x, y, title, controls[]
   */
  function showPanelUI(data) {
    hidePanelUI();
    hidePopupMenu(false);
    currentPanelId = data.id;

    // Release pointer capture so panel receives pointer events.
    if (capturedPointerId >= 0) {
      try { mainArea.releasePointerCapture(capturedPointerId); } catch (_) {}
      dragging = false;
      dragButton = -1;
      capturedPointerId = -1;
    }

    const panelEl = document.createElement('div');
    panelEl.className = 'panel-container';

    // Title bar
    if (data.title) {
      const titleEl = document.createElement('div');
      titleEl.className = 'panel-title';
      titleEl.textContent = data.title;
      panelEl.appendChild(titleEl);
    }

    // Render each control based on its type.
    const controls = data.controls || [];

    controls.forEach((ctrl) => {
      if (ctrl.type === 'section_header') {
        const sectionEl = document.createElement('div');
        sectionEl.className = 'panel-section-header';
        sectionEl.textContent = ctrl.label || '';
        panelEl.appendChild(sectionEl);
        return;
      }

      const row = document.createElement('div');
      row.className = 'panel-control';
      if (ctrl.disabled) row.classList.add('panel-control-disabled');
      if (ctrl.subField) row.classList.add('panel-control-subfield');
      if (ctrl.tooltip) bindTooltip(row, ctrl.tooltip);

      // All control types except standalone button get a label column.
      if (ctrl.type !== 'button' && ctrl.type !== 'checkbox') {
        const label = document.createElement('span');
        label.className = 'panel-control-label';
        label.textContent = ctrl.label || ctrl.id;
        row.appendChild(label);
      }

      if (ctrl.type === 'checkbox') {
        const label = document.createElement('span');
        label.className = 'panel-control-label';
        label.textContent = ctrl.label || ctrl.id;
        row.appendChild(label);

        const checkWrap = document.createElement('div');
        checkWrap.className = 'panel-checkbox-wrap';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !!ctrl.value;
        cb.disabled = !!ctrl.disabled;
        if (ctrl.tooltip) bindTooltip(cb, ctrl.tooltip, { delayMs: 120 });
        cb.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
        cb.addEventListener('change', (e) => {
          e.stopPropagation();
          sendInput({ type: 'panel_change', id: currentPanelId, controlId: ctrl.id, value: cb.checked });
        });
        checkWrap.appendChild(cb);
        row.appendChild(checkWrap);

      } else if (ctrl.type === 'button_strip') {
        const strip = document.createElement('div');
        strip.className = 'panel-btn-strip';
        const options = ctrl.options || [];
        options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.textContent = opt;
          if (idx === ctrl.value) btn.classList.add('active');
          if (ctrl.disabled) btn.disabled = true;
          btn.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); });
          btn.addEventListener('pointerup', (e) => {
            e.stopPropagation(); e.preventDefault();
            if (ctrl.disabled) return;
            strip.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            sendInput({ type: 'panel_change', id: currentPanelId, controlId: ctrl.id, value: idx });
            log('Panel change: ' + ctrl.id + ' = ' + idx, 'info');
          });
          strip.appendChild(btn);
        });
        row.appendChild(strip);

      } else if (ctrl.type === 'slider') {
        const sliderWrap = document.createElement('div');
        sliderWrap.className = 'panel-slider';
        const input = document.createElement('input');
        input.type = 'range';
        input.min = ctrl.min !== undefined ? ctrl.min : 0;
        input.max = ctrl.max !== undefined ? ctrl.max : 1;
        input.step = ctrl.step !== undefined ? ctrl.step : 0.01;
        input.value = ctrl.value !== undefined ? ctrl.value : 0.5;
        input.disabled = !!ctrl.disabled;
        if (ctrl.tooltip) bindTooltip(input, ctrl.tooltip, { delayMs: 120 });
        const valDisplay = document.createElement('span');
        valDisplay.className = 'panel-slider-value';
        valDisplay.textContent = parseFloat(input.value).toFixed(2);
        input.addEventListener('input', () => {
          if (ctrl.disabled) return;
          const v = parseFloat(input.value);
          valDisplay.textContent = v.toFixed(2);
          sendInput({ type: 'panel_change', id: currentPanelId, controlId: ctrl.id, value: v });
        });
        input.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
        input.addEventListener('pointerup', (e) => { e.stopPropagation(); });
        sliderWrap.appendChild(input);
        sliderWrap.appendChild(valDisplay);
        row.appendChild(sliderWrap);

      } else if (ctrl.type === 'button_row') {
        // Label + multiple action buttons on the same row.
        const btnRow = document.createElement('div');
        btnRow.className = 'panel-btn-row';
        (ctrl.buttons || []).forEach((btnDef) => {
          const btn = document.createElement('button');
          btn.className = 'panel-action-btn';
          btn.textContent = btnDef.label || btnDef.id;
          btn.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); });
          btn.addEventListener('pointerup', (e) => {
            e.stopPropagation(); e.preventDefault();
            // Collect form data from all inputs within the panel for form-style panels.
            const msg = { type: 'panel_change', id: currentPanelId,
              controlId: ctrl.id, buttonId: btnDef.id, value: true };
            // Gather form fields from the panel DOM.
            const panel = panelEl;
            const textInputs = panel.querySelectorAll('input[type="text"][data-ctrl-id]');
            textInputs.forEach(inp => { msg['form' + capitalize(inp.dataset.ctrlId)] = inp.value; });
            const selects = panel.querySelectorAll('select[data-ctrl-id]');
            selects.forEach(sel => { msg['form' + capitalize(sel.dataset.ctrlId)] = parseInt(sel.value); });
            const intInputs = panel.querySelectorAll('input[type="number"][data-ctrl-id]');
            intInputs.forEach(inp => {
              const key = 'form' + capitalize(inp.dataset.ctrlId);
              const axis = parseInt(inp.dataset.axis || '0');
              if (axis === 0) msg[key.replace('WidthHeight', 'Width')] = parseInt(inp.value) || 0;
              if (axis === 1) msg[key.replace('WidthHeight', 'Height')] = parseInt(inp.value) || 0;
            });
            sendInput(msg);
            log('Panel button_row: ' + ctrl.id + '.' + btnDef.id, 'info');
          });
          btnRow.appendChild(btn);
        });
        row.appendChild(btnRow);

      } else if (ctrl.type === 'linked_vector3') {
        // Linked X/Y/Z float inputs with a link toggle button.
        const v3Wrap = document.createElement('div');
        v3Wrap.className = 'panel-linked-v3';
        let linked = ctrl.linked !== false;
        const linkBtn = document.createElement('button');
        linkBtn.className = 'panel-link-btn' + (linked ? ' active' : '');
        linkBtn.textContent = '\u{1F517}';
        bindTooltip(linkBtn, 'Link axes');
        linkBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); });
        linkBtn.addEventListener('pointerup', (e) => {
          e.stopPropagation(); e.preventDefault();
          linked = !linked;
          linkBtn.classList.toggle('active', linked);
          yInput.disabled = linked; zInput.disabled = linked;
          sendInput({ type: 'panel_change', id: currentPanelId, controlId: ctrl.id + '_link', value: linked });
        });
        v3Wrap.appendChild(linkBtn);
        const axes = ['x', 'y', 'z'];
        const vals = ctrl.value || [0.25, 0.25, 0.25];
        const inputs = [];
        axes.forEach((axis, idx) => {
          const lbl = document.createElement('span');
          lbl.className = 'panel-v3-label';
          lbl.textContent = axis.toUpperCase();
          v3Wrap.appendChild(lbl);
          const inp = document.createElement('input');
          inp.type = 'number';
          inp.className = 'panel-v3-input';
          inp.value = vals[idx];
          inp.step = '0.01';
          if (linked && idx > 0) inp.disabled = true;
          inp.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
          inp.addEventListener('change', () => {
            const fv = parseFloat(inp.value) || 0;
            if (linked) {
              inputs.forEach(i => { i.value = fv; });
              sendInput({ type: 'panel_change', id: currentPanelId, controlId: ctrl.id,
                value: [fv, fv, fv] });
            } else {
              sendInput({ type: 'panel_change', id: currentPanelId, controlId: ctrl.id,
                value: inputs.map(i => parseFloat(i.value) || 0) });
            }
          });
          inputs.push(inp);
          v3Wrap.appendChild(inp);
        });
        var yInput = inputs[1], zInput = inputs[2];
        row.appendChild(v3Wrap);

      } else if (ctrl.type === 'float_field') {
        // Single float input field.
        const inp = document.createElement('input');
        inp.type = 'number';
        inp.className = 'panel-float-input';
        inp.value = ctrl.value !== undefined ? ctrl.value : 0;
        inp.step = ctrl.step || '0.01';
        inp.disabled = !!ctrl.disabled;
        if (ctrl.tooltip) bindTooltip(inp, ctrl.tooltip, { delayMs: 120 });
        inp.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
        inp.addEventListener('change', () => {
          if (ctrl.disabled) return;
          sendInput({ type: 'panel_change', id: currentPanelId, controlId: ctrl.id,
            value: parseFloat(inp.value) || 0 });
        });
        row.appendChild(inp);

      } else if (ctrl.type === 'text_input') {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'panel-text-input';
        inp.value = ctrl.value || '';
        inp.placeholder = ctrl.placeholder || '';
        inp.dataset.ctrlId = ctrl.id;
        inp.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
        inp.addEventListener('change', () => {
          sendInput({ type: 'panel_change', id: currentPanelId, controlId: ctrl.id, value: inp.value });
        });
        row.appendChild(inp);

      } else if (ctrl.type === 'dropdown') {
        const sel = document.createElement('select');
        sel.className = 'panel-dropdown';
        sel.dataset.ctrlId = ctrl.id;
        (ctrl.options || []).forEach((opt, idx) => {
          const o = document.createElement('option');
          o.value = idx;
          o.textContent = opt;
          if (idx === ctrl.value) o.selected = true;
          sel.appendChild(o);
        });
        sel.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
        sel.addEventListener('change', () => {
          sendInput({ type: 'panel_change', id: currentPanelId, controlId: ctrl.id, value: parseInt(sel.value) });
        });
        row.appendChild(sel);

      } else if (ctrl.type === 'int2_field') {
        const wrap = document.createElement('div');
        wrap.className = 'panel-int2-wrap';
        const labels = ctrl.labels || ['X', 'Y'];
        const vals = ctrl.value || [0, 0];
        labels.forEach((lbl, idx) => {
          const lblEl = document.createElement('span');
          lblEl.className = 'panel-v3-label';
          lblEl.textContent = lbl;
          wrap.appendChild(lblEl);
          const inp = document.createElement('input');
          inp.type = 'number';
          inp.className = 'panel-int-input';
          inp.dataset.ctrlId = ctrl.id;
          inp.dataset.axis = idx;
          inp.value = vals[idx];
          inp.min = '0';
          inp.step = '1';
          inp.addEventListener('pointerdown', (e) => { e.stopPropagation(); });
          inp.addEventListener('change', () => {
            sendInput({ type: 'panel_change', id: currentPanelId, controlId: ctrl.id,
              value: [parseInt(inp.value) || 0], axis: idx });
          });
          wrap.appendChild(inp);
        });
        row.appendChild(wrap);

      } else if (ctrl.type === 'button') {
        // Standalone button (full width).
        const btn = document.createElement('button');
        btn.className = 'panel-action-btn';
        btn.textContent = ctrl.label || ctrl.id;
        btn.style.flex = '1';
        btn.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); });
        btn.addEventListener('pointerup', (e) => {
          e.stopPropagation(); e.preventDefault();
          sendInput({ type: 'panel_change', id: currentPanelId, controlId: ctrl.id, value: true });
          log('Panel action: ' + ctrl.id, 'info');
        });
        row.appendChild(btn);
      }

      panelEl.appendChild(row);
    });

    // Position the panel using Unity pixel coordinates.
    const rawUnityX = Number(data.x || 0);
    const rawUnityY = Number(data.y || 0);
    let domPos = unityPixelToDOM(rawUnityX, rawUnityY);
    let anchorSource = 'unity_xy';

    const anchorRect = data.anchorRect || null;
    const ax = Number(anchorRect && anchorRect.x);
    const ay = Number(anchorRect && anchorRect.y);
    const aw = Number(anchorRect && anchorRect.w);
    const ah = Number(anchorRect && anchorRect.h);
    const hasValidAnchorRect =
      Number.isFinite(ax) && Number.isFinite(ay) &&
      Number.isFinite(aw) && Number.isFinite(ah) &&
      aw > 0 && ah > 0;
    if (hasValidAnchorRect) {
      domPos = unityPixelToDOM(ax, ay + ah);
      anchorSource = 'anchor_rect';
    }

    // Keep panel anchor robust in Windows offscreen mode.
    // Some PopupWindow-based panels (e.g. SceneView Grid Settings) may carry
    // hidden-window coordinates (~32000,32000). In that case anchor by pointer.
    const vw = Math.max(1, Number(remoteVideo.videoWidth || 0));
    const vh = Math.max(1, Number(remoteVideo.videoHeight || 0));
    const unityAnchorLooksInvalid =
      !Number.isFinite(rawUnityX) || !Number.isFinite(rawUnityY) ||
      rawUnityX < -vw || rawUnityY < -vh ||
      rawUnityX > vw * 2 || rawUnityY > vh * 2;
    if (!hasValidAnchorRect && unityAnchorLooksInvalid) {
      domPos = getFallbackAnchor('panel');
      anchorSource = 'pointer_fallback';
      log('Panel anchor fallback: unity=(' + Math.round(rawUnityX) + ',' + Math.round(rawUnityY) +
          ') pointer=(' + Math.round(domPos.x) + ',' + Math.round(domPos.y) + ')', 'info');
    }

    panelEl.style.left = domPos.x + 'px';
    panelEl.style.top = domPos.y + 'px';

    popupOverlay.innerHTML = '';
    popupOverlay.appendChild(panelEl);
    popupOverlay.style.display = 'block';

    // Adjust if the panel overflows the container.
    requestAnimationFrame(() => {
      const mainRect = mainArea.getBoundingClientRect();
      const panelRect = panelEl.getBoundingClientRect();
      let left = parseFloat(panelEl.style.left);
      let top = parseFloat(panelEl.style.top);
      if (left + panelRect.width > mainRect.width)
        left = Math.max(0, mainRect.width - panelRect.width);
      if (top + panelRect.height > mainRect.height)
        top = Math.max(0, mainRect.height - panelRect.height);
      panelEl.style.left = left + 'px';
      panelEl.style.top = top + 'px';
    });

    log('Panel shown: ' + currentPanelId + ' (' + controls.length + ' controls) at DOM(' +
        Math.round(domPos.x) + ',' + Math.round(domPos.y) + ') source=' + anchorSource, 'info');
  }

  /**
   * Hide the panel UI and optionally notify the server.
   */
  function hidePanelUI() {
    hideUnityTooltip();
    if (!currentPanelId) return;
    popupOverlay.style.display = 'none';
    popupOverlay.innerHTML = '';
    currentPanelId = null;
  }

  // =================== Auto-start offscreen capture for embedded fill mode ===================
  function resolveCompositeApplyMode(phase) {
    const currentPhase = phase || 'update';
    const preset = compositeLayout ? (compositeLayout.layoutPreset || '') : '';
    const isPresetLayout = preset === 'unity-default-layout' || preset === 'codely-saved-layout';
    // Preset layouts are explicit full snapshots only on first start.
    // During in-session updates (close/add tab), keep native auto-tracked views.
    if (isPresetLayout && currentPhase === 'start') {
      return 'strict_replace';
    }
    // Regular sidebar layout edits should only replace frontend-managed slots
    // and keep auto-tracked native slots (e.g. FrameDebugger tabs).
    return 'replace_managed_keep_native';
  }

  function buildCompositeRequestPayload(size, phase) {
    var slots = (compositeLayout && Array.isArray(compositeLayout.slots))
      ? compositeLayout.slots
      : [];
    var applyMode = resolveCompositeApplyMode(phase);
    log('Composite request mode: phase=' + (phase || 'update') +
        ' preset=' + (compositeLayout ? (compositeLayout.layoutPreset || '') : '') +
        ' applyMode=' + applyMode, 'info');
    return {
      fps: STREAM_FPS,
      width: size.width,
      height: size.height,
      dpr: size.dpr || 1,
      layoutPreset: compositeLayout ? (compositeLayout.layoutPreset || '') : '',
      applyMode: applyMode,
      focusedSlotId: compositeLayout ? (compositeLayout.focusedSlotId || '') : '',
      slots: slots.map(function(slot) {
        return {
          slotId: slot.slotId,
          windowType: slot.windowType,
          title: slot.title || '',
          rect: slot.rect
        };
      })
    };
  }

  // Guard against duplicate startCompositeLayout calls (e.g. parent sends
  // update-composite-layout twice before the first call finishes).
  var _compositeStarting = false;

  async function startCompositeLayout() {
    if (_compositeStarting) {
      log('startCompositeLayout already in progress, skipping duplicate call', 'info');
      return;
    }
    if (!compositeLayout || !Array.isArray(compositeLayout.slots) || compositeLayout.slots.length === 0) return;
    _compositeStarting = true;
    try {
    var initialSize = getMainAreaSizeForStream();
    activeOffscreenWindowType = '__composite__';
    currentWindowType = '__composite__';
    activeCompositeSlotId = activeCompositeSlotId || compositeLayout.slots[0].slotId || '';
    log('Starting composite stream with ' + compositeLayout.slots.length + ' slots', 'info');

    var r = await fetchJson('/stream/start-composite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(buildCompositeRequestPayload(initialSize, 'start'))
    });
    if (!r || r.error) {
      log('Composite start failed: ' + JSON.stringify(r), 'err');
      return;
    }

    capturing = true;
    placeholder.style.display = 'none';
    startHeartbeat();
    try {
      await startWebRTC();
      trackWebRTCFps();
    } catch (e) {
      log('WebRTC init failed during composite start: ' + e.message, 'err');
    }
    } finally { _compositeStarting = false; }
  }

  async function updateCompositeLayout() {
    if (!compositeLayout || !Array.isArray(compositeLayout.slots) || compositeLayout.slots.length === 0) {
      if (capturing) stopCapture();
      return;
    }
    var size = getMainAreaSizeForStream();
    if (!capturing || activeOffscreenWindowType !== '__composite__') {
      if (capturing) {
        cancelReconnect();
        closeWebRTC();
        stopHeartbeat();
        capturing = false;
      }
      await startCompositeLayout();
      return;
    }
    await fetchJson('/stream/update-composite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(buildCompositeRequestPayload(size, 'update'))
    });
    log('Composite layout updated: ' + compositeLayout.slots.length + ' slots', 'info');
  }

  // Starts (or restarts) offscreen capture for the current autoWindowType.
  // Does NOT stop an existing stream — callers must stop first if needed.
  async function autoStartOffscreen() {
    if (!autoWindowType) return;
    if (capturing && activeOffscreenWindowType === autoWindowType) return;
    compositeLayout = null;
    activeCompositeSlotId = '';

    log('Auto-starting offscreen capture for: ' + autoWindowType, 'info');
    activeOffscreenWindowType = autoWindowType;
    currentWindowType = autoWindowType;
    const fps = STREAM_FPS;
    const initialSize = getMainAreaSizeForStream();

    const r = await fetchJson('/stream/start-offscreen', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fps,
        width: initialSize.width,
        height: initialSize.height,
        dpr: initialSize.dpr,
        windowType: autoWindowType
      })
    });

    if (!r || r.error) {
      log('Auto-start offscreen failed: ' + JSON.stringify(r), 'err');
      return;
    }

    capturing = true;
    placeholder.style.display = 'none';
    log('Auto-started offscreen capture: ' + autoWindowType, 'ok');
    startHeartbeat();

    if (initialSize.width > 0 && initialSize.height > 0) {
      void apiFetch('/stream/resize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ width: initialSize.width, height: initialSize.height, dpr: initialSize.dpr })
      }).catch(() => {});
    }

    try {
      await startWebRTC();
      trackWebRTCFps();
    } catch (e) {
      log('WebRTC init failed during auto-start: ' + e.message, 'err');
    }
  }

  // Serialized stream switcher — only ONE switch executes at a time.
  // If a second switch arrives while one is in flight, the new target is
  // recorded in autoWindowType and the running switch picks it up when it
  // finishes, avoiding duplicate HTTP requests and wrong-view bugs.
  var switchBusy = false;

  async function switchStream(newWindowType) {
    autoWindowType = newWindowType;
    if (switchBusy) {
      log('switchStream: queued → ' + newWindowType + ' (previous switch still running)', 'info');
      return;
    }
    switchBusy = true;
    try {
      while (true) {
        var targetType = autoWindowType;
        log('switchStream: ' + (activeOffscreenWindowType || '(none)') + ' → ' + targetType, 'info');
        if (capturing) {
          cancelReconnect();
          reconnectAttempt = 0;
          closeWebRTC();
          stopHeartbeat();
          capturing = false;
        }
        await autoStartOffscreen();
        // If autoWindowType was changed by a queued call while we were
        // awaiting, loop to handle the latest requested type.
        if (autoWindowType === targetType) break;
        log('switchStream: target changed during switch, re-executing...', 'info');
      }
    } finally {
      switchBusy = false;
    }
  }

  // =================== Parent panel message listener ===================
  window.addEventListener('message', function(event) {
    if (event.source !== window.parent || event.origin !== window.location.origin) return;
    const msg = event.data;
    if (!msg || msg.source !== 'parentPanel') return;
    if (msg.messageType === 'unity-window/request-capture') {
      captureToChat();
    }
    if (msg.messageType === 'unity-window/request-stop') {
      if (capturing) stopCapture();
    }
    if (msg.messageType === 'unity-window/set-audio') {
      var enabled = msg.data && msg.data.enabled;
      if (typeof enabled === 'boolean') setAudioEnabled(enabled);
    }
    if (msg.messageType === 'unity-window/request-composite-layout') {
      if (typeof sendInput === 'function') {
        sendInput({ type: 'request_composite_layout' });
      } else {
        window.parent.postMessage({
          source: 'unityWindowBridge',
          messageType: 'unity-window/composite-layout-snapshot',
          data: { slots: [] }
        }, '*');
      }
    }
    // Parent tells us to switch to a different Unity window type
    // without destroying/recreating the iframe.
    if (msg.messageType === 'unity-window/switch-stream') {
      var newType = msg.data && msg.data.windowType;
      if (newType) {
        switchStream(newType);
      }
    }
    if (msg.messageType === 'unity-window/update-composite-layout') {
      if (msg.data && typeof msg.data.serverUrl === 'string') {
        updateServerApi(msg.data.serverUrl);
      }
      compositeLayout = msg.data && msg.data.layout ? msg.data.layout : null;
      if (!API) {
        requestParentUrlRefresh();
        return;
      }
      var applyCompositeLayout = function() {
        if (compositeLayout && Array.isArray(compositeLayout.slots) && compositeLayout.slots.length > 0) {
          activeCompositeSlotId = compositeLayout.focusedSlotId || activeCompositeSlotId || compositeLayout.slots[0].slotId || '';
          updateCompositeLayout();
        } else if (capturing) {
          stopCapture();
        }
      };
      applyCompositeLayout();
    }
  });

  // =================== Init ===================
  window.addEventListener('pagehide', () => { notifyStopOnPageClose(); });
  window.addEventListener('beforeunload', () => { notifyStopOnPageClose(); });

  // Track server health so we can auto-reload windows upon reconnection.
  var wasHealthy = false;
  // Count consecutive health-check failures. When the Tauri proxy token
  // expires (2h TTL) or the NWB backend restarts on a new port (502),
  // the iframe can never recover on its own — ask the parent to
  // re-resolve the signaling URL. With threshold=2 and 3s interval the
  // URL refresh triggers within ~5s of backend becoming unreachable.
  var consecutiveHealthFailures = 0;
  var urlRefreshRequested = false;
  // Set when server explicitly sent stream_stop (user clicked Disconnect).
  // Prevents health-check failures from triggering URL refresh / reconnect.
  var serverStoppedStream = false;
  const HEALTH_FAILURES_BEFORE_URL_REFRESH = 2;
  const HEALTH_CHECK_INTERVAL_MS = 3000;

  if (API) {
    checkHealth().then(function(ok) {
      wasHealthy = ok;
      if (ok) {
        // In fill mode, do NOT auto-start from URL param. Instead, notify the
        // parent that we are ready, so it sends the correct window type.
        notifyParentReady();
      } else {
        consecutiveHealthFailures++;
        log('Server not reachable – will auto-retry every ' +
            (HEALTH_CHECK_INTERVAL_MS / 1000) + 's', 'err');
      }
    });
  } else {
    log('Waiting for parent to provide the window bridge server URL', 'info');
    notifyParentReady();
  }

  // Notify parent that this iframe is loaded and ready to receive switch-stream.
  function notifyParentReady() {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ source: 'windowBridge', type: 'ready' }, '*');
      log('Sent ready signal to parent panel', 'info');
    }
  }

  // Ask parent to re-resolve the signaling URL (token may have expired,
  // or Tauri proxy session is stale). Domain reload no longer triggers
  // this — server stays alive with the same port.
  function requestParentUrlRefresh() {
    if (urlRefreshRequested) return;
    urlRefreshRequested = true;
    if (window.parent && window.parent !== window) {
      var refreshData = {
        source: 'unityWindowBridge',
        messageType: 'unity-window/request-url-refresh',
        data: { reason: 'health_check' }
      };
      window.parent.postMessage(refreshData, '*');
      log('Requested parent to refresh stream URL', 'err');
    }
  }

  setInterval(async function() {
    // Skip health checks entirely after server-initiated stop to prevent
    // triggering an unwanted URL refresh and reconnection.
    if (!API || serverStoppedStream) return;
    var ok = await checkHealth();
    if (ok) {
      consecutiveHealthFailures = 0;
      urlRefreshRequested = false;
      if (!wasHealthy) {
        log('Server reconnected, refreshing state...', 'ok');
        if (!capturing) {
          notifyParentReady();
        }
      }
    } else {
      consecutiveHealthFailures++;
      if (consecutiveHealthFailures >= HEALTH_FAILURES_BEFORE_URL_REFRESH) {
        requestParentUrlRefresh();
      }
    }
    wasHealthy = ok;
  }, HEALTH_CHECK_INTERVAL_MS);
  setupInputForwarding();
  log('Window Bridge page loaded (WebRTC)');
})();
</script>
</body>
</html>
